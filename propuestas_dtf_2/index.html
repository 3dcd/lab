function zoomTF(card){const t=tf(card.init),z=card.zoom||{};for(const[k,v]of Object.entries(z)){if(k==='x')t.x=v;else if(k==='y')t.y=v;else if(k==='scaleX')t.sx=v;else if(k==='scaleY')t.sy=v;else if(k==='regX')t.rx=v;else if(k==='regY')t.ry=v;else if(k==='rotation')t.rot=v}return t}
function tintCanvas(img,color){const key=img.src+'|'+color;if(tintCanvas.cache[key])return tintCanvas.cache[key];const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle=color;x.fillRect(0,0,c.width,c.height);return tintCanvas.cache[key]=c}tintCanvas.cache={};
function drawBase(c,card,img){c.save();applyTF(c,tf(card.content_tf));applyTF(c,tf(card.base_tf));c.drawImage(img,0,0);c.restore()}
function drawLogo(c,card){if(!logoImg)return;c.save();applyTF(c,tf(card.logo_tf));const s=Math.min(267.2*logoScale/logoImg.naturalWidth,227.3*logoScale/logoImg.naturalHeight);c.drawImage(logoImg,-logoImg.naturalWidth*s/2,-logoImg.naturalHeight*s/2,logoImg.naturalWidth*s,logoImg.naturalHeight*s);c.restore()}
function renderCard(el,exportScale=1){const card=el._data,b=card.bounds,canvas=el.querySelector('canvas'),W=b[2],H=b[3],sc=DPR*exportScale;canvas.width=Math.round(W*sc);canvas.height=Math.round(H*sc);const c=canvas.getContext('2d');c.setTransform(sc,0,0,sc,0,0);c.clearRect(0,0,W,H);c.fillStyle=$('#bgColor').value;c.fillRect(0,0,W,H);c.save();c.translate(-b[0],-b[1]);c.beginPath();c.rect(b[0],b[1],W,H);c.clip();applyTF(c,el._zoom?zoomTF(card):tf(card.init));const img=images[card.atlas];if(img){drawBase(c,card,img);c.save();c.globalCompositeOperation='multiply';const tc=tintCanvas(img,$('#shirtColor').value);c.save();applyTF(c,tf(card.content_tf));applyTF(c,tf(card.base_tf));c.drawImage(tc,0,0);c.restore();c.restore();drawLogo(c,card);c.save();c.globalCompositeOperation='darken';drawBase(c,card,img);c.restore()}c.restore();return canvas}
function renderAll(){tintCanvas.cache={};document.querySelectorAll('.card').forEach(renderCard)}function niceName(n){return n.replace('buzo_capucha','buzo con capucha').replace('jeam','jean').replaceAll('_',' ').replace(/\w/g,m=>m.toUpperCase())}
function build(){content.className='';content.innerHTML='';for(const g of [...new Set(CARDS.map(c=>c.group))]){const list=CARDS.filter(c=>c.group===g),sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="section-head"><h2>${GROUP_LABELS[g]||g}</h2><span>${list.length} propuesta${list.length!==1?'s':''}</span></div><div class="grid"></div>`;const grid=sec.querySelector('.grid');for(const card of list){const el=document.createElement('article');el.className='card'+(card.bounds[3]>450?' tall':'');el._data=card;el._zoom=false;el.innerHTML=`<div class="canvas-wrap"><canvas></canvas><div class="badge">${niceName(card.display_name)}</div><div class="actions"><button class="icon exp" title="Exportar PNG">⇩</button><button class="icon mag" title="Lupa">⌕</button></div></div>`;el.querySelector('.mag').onclick=()=>{el._zoom=!el._zoom;el.querySelector('.mag').classList.toggle('active',el._zoom);renderCard(el)};el.querySelector('.exp').onclick=()=>downloadCard(el);grid.appendChild(el)}content.appendChild(sec)}ready=true;renderAll();statusEl.textContent='Listo'}
async function downloadCard(el){const c=renderCard(el,2),blob=await new Promise(r=>c.toBlob(r,'image/png'));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=el._data.display_name+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);renderCard(el)}
async function exportAll(){if(!ready)return;statusEl.textContent='Armando ZIP…';const zip=new JSZip();for(const el of document.querySelectorAll('.card')){const c=renderCard(el,2),blob=await new Promise(r=>c.toBlob(r,'image/png'));zip.file(el._data.display_name+'.png',blob);renderCard(el)}const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),a=document.createElement('a');a.href=URL.createObjectURL(out);a.download='TSC_propuestas_prendas.zip';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500);statusEl.textContent='Listo'}
function preload(){const ats=[...new Set(CARDS.map(c=>c.atlas))];let left=ats.length;for(const a of ats){const im=new Image();im.onload=()=>{images[a]=im;if(--left===0)build()};im.onerror=()=>statusEl.textContent='Falta '+a;im.src='images/'+a+'.png'}}
$('#shirtColor').oninput=renderAll;$('#bgColor').oninput=renderAll;$('#logoScale').oninput=e=>{logoScale=+e.target.value/100;$('#logoScaleValue').textContent=e.target.value+'%';renderAll()};$('#logoInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{logoImg=im;$('#logoThumb').src=u;$('#logoThumb').classList.add('show');renderAll()};im.src=u};$('#clearLogo').onclick=()=>{logoImg=null;$('#logoInput').value='';$('#logoThumb').classList.remove('show');renderAll()};$('#resetZoom').onclick=()=>{document.querySelectorAll('.card').forEach(el=>{el._zoom=false;el.querySelector('.mag').classList.remove('active')});renderAll()};$('#exportAll').onclick=exportAll;preload();
</script></body></html>
