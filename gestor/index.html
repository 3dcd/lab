<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>Gestor</title>
<style>
:root{
  --bg:#eef2f5;
  --card:#ffffff;
  --ink:#15171a;
  --muted:#68717c;
  --line:#dbe1e7;
  --shadow:0 12px 30px rgba(20,23,26,.10);

  --received:#087f73;
  --received-soft:#d8f5ef;
  --received-border:#a8e4d9;

  --delivered:#64748b;
  --delivered-soft:#e7edf3;
  --delivered-border:#ccd6e0;

  --accent:#1f2937;
  --accent-soft:#e7edf7;
  --warm:#d97706;
  --warm-soft:#fff1d6;
  --danger:#a52b2b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;min-height:100dvh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
body{padding-bottom:max(92px,env(safe-area-inset-bottom))}
.app{
  max-width:760px;
  margin:0 auto;
  padding:14px 14px 28px;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  margin:-14px -14px 12px;
  padding:max(12px,env(safe-area-inset-top)) 14px 12px;
  background:rgba(243,244,246,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,0,0,.04);
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:24px;line-height:1;font-weight:950;letter-spacing:-.5px}
.brand small{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:700}
.iconbtn{
  width:44px;height:44px;border:1px solid var(--line);border-radius:16px;background:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.05)
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0 14px;
}
.stat{
  border-radius:20px;
  padding:12px 14px;
  box-shadow:var(--shadow);
  border:1px solid transparent;
}
.stat.received{background:var(--received-soft);border-color:var(--received-border)}
.stat.delivered{background:var(--delivered-soft);border-color:var(--delivered-border)}
.stat b{display:block;font-size:26px;line-height:1;font-weight:950}
.stat span{display:block;margin-top:6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.45px}
.toolbar{
  display:flex;gap:9px;overflow-x:auto;padding:4px 0 7px;scrollbar-width:none
}
.toolbar::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;
  font-size:12px;font-weight:900;color:#30343a;box-shadow:0 3px 10px rgba(0,0,0,.04)
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 14px rgba(31,41,55,.18)}
#shareCurrent{background:var(--warm-soft);border-color:#f0cf97;color:#9a5a06}
.section-title{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:16px 2px 10px;
}
.section-title h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.section-title small{color:var(--muted);font-size:11px;font-weight:700}
.list{display:grid;gap:12px}
.card{
  background:var(--card);
  border-radius:24px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.received{border-left:0}
.card.delivered{border-left:0;opacity:.86}
.cardhead{
  display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;
  padding:12px;
}
.thumb{
  width:62px;height:62px;border-radius:17px;overflow:hidden;background:#eef1f4;border:1px solid var(--line);
  display:grid;place-items:center;color:#a0a5ac;font-size:22px;font-weight:900
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.client{min-width:0}
.client h3{
  margin:0;font-size:18px;line-height:1.1;font-weight:950;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.client p{
  margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.35;font-weight:650
}
.status{
  border-radius:999px;padding:7px 9px;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.35px
}
.status.received{background:var(--received-soft);color:var(--received)}
.status.delivered{background:var(--delivered-soft);color:var(--delivered)}
.cardbody{padding:0 12px 14px}
.items{
  background:#f6f8fa;border:1px solid #e3e8ee;border-radius:17px;padding:11px 12px;
  display:grid;gap:8px
}
.itemrow{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.itemrow strong{font-weight:900}
.itemrow span{color:var(--muted);font-weight:650;text-align:right}
.notes{font-size:12px;color:#4d5259;line-height:1.45;margin-top:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.action{
  min-height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 13px;
  font-size:12px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.035)
}
.action.primary{background:var(--received);border-color:var(--received);color:#fff}
.action.gray{background:var(--delivered);border-color:var(--delivered);color:#fff}
.action.danger{color:var(--danger)}
.fab{
  position:fixed;
  right:max(18px,env(safe-area-inset-right));
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:30;
  width:64px;height:64px;border-radius:22px;border:0;background:linear-gradient(145deg,#263547,#111827);color:#fff;
  font-size:34px;line-height:1;font-weight:400;box-shadow:0 16px 35px rgba(17,24,39,.32)
}
.empty{
  background:#fff;border:1px dashed #d4d8dd;border-radius:22px;padding:26px 18px;text-align:center;color:var(--muted);
  font-size:13px;line-height:1.5
}

.modalback{
  position:fixed;inset:0;z-index:100;background:rgba(16,18,20,.38);
  display:none;align-items:flex-end;justify-content:center
}
.modalback.show{display:flex}
.sheet{
  width:min(760px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:16px 14px max(18px,env(safe-area-inset-bottom));
  box-shadow:0 -16px 50px rgba(0,0,0,.2)
}
.dragbar{width:54px;height:5px;border-radius:999px;background:#d7dbe0;margin:2px auto 14px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheethead h2{margin:0;font-size:21px;font-weight:950}
.closebtn{width:42px;height:42px;border-radius:15px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:900}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:10px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.45px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 14px;font-size:15px;outline:none;
}
.field textarea{min-height:76px;resize:vertical}
.photoPick{
  display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;
  padding:11px;border:1px solid #d8e0e7;border-radius:20px;background:#f4f7f9
}
.photoBox{
  width:92px;height:92px;border-radius:20px;overflow:hidden;background:#e9edf1;border:1px solid var(--line);
  display:grid;place-items:center;color:#81868d;font-weight:900;font-size:11px;text-align:center;padding:8px
}
.photoBox img{width:100%;height:100%;object-fit:cover}
.photoActions{display:grid;gap:8px}
.bigbtn{
  border:0;border-radius:16px;padding:13px 14px;font-size:13px;font-weight:950
}
.bigbtn.camera{background:var(--accent);color:#fff}
.bigbtn.gallery{background:#fff;border:1px solid var(--line);color:#30343a}
.item-editor{
  display:grid;grid-template-columns:1.5fr .8fr 1fr auto;gap:8px;align-items:end;
  background:#f5f8fa;border:1px solid #dfe6ec;border-radius:18px;padding:11px
}
.item-editor input,.item-editor select{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px 11px;background:#fff}
.removeitem{width:40px;height:40px;border-radius:13px;border:1px solid #ead7d7;background:#fff;color:var(--danger);font-weight:950}
.additem{
  border:1px dashed #bfc5cc;background:#fff;border-radius:15px;padding:11px 12px;font-size:12px;font-weight:900;color:#3d4248
}
.sheetfoot{
  position:sticky;bottom:0;background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));
  padding-top:14px;margin-top:6px;display:grid;grid-template-columns:1fr 1.3fr;gap:8px
}
.secondarySave{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px;font-weight:900}
.primarySave{border:0;background:var(--received);color:#fff;border-radius:17px;padding:14px;font-weight:950}

.menu{
  position:fixed;z-index:120;top:68px;right:14px;width:220px;background:#fff;border:1px solid var(--line);
  border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.16);padding:8px;display:none
}
.menu.show{display:grid;gap:4px}
.menu button{border:0;background:#fff;border-radius:14px;text-align:left;padding:12px 11px;font-size:12px;font-weight:850}
.menu button:hover{background:#f6f7f8}
.hidden{display:none!important}

@media(min-width:700px){
  .fab{right:calc((100vw - 760px)/2 + 18px)}
  .sheet{margin-bottom:16px;border-radius:28px}
  .modalback{align-items:center;padding:20px}
  .stats{grid-template-columns:repeat(2,180px);justify-content:start}
}

body.mode-received{background:#9fdbc9}
body.mode-delivered{background:#a65a68}
body.mode-all{background:#6fa0c9}
.statbtn{appearance:none;text-align:left;width:100%;cursor:pointer;transition:.18s;outline:none}
.statbtn.selected{transform:translateY(-2px)}
.statbtn.received.selected{border-color:#5bc4b6;box-shadow:0 14px 34px rgba(8,127,115,.20)}
.statbtn.delivered.selected{border-color:#aebdca;box-shadow:0 14px 34px rgba(100,116,139,.20)}
.statbtn:active{transform:scale(.985)}

body.mode-received .top{background:rgba(159,219,201,.92)}
body.mode-delivered .top{background:rgba(166,90,104,.92)}
body.mode-all .top{background:rgba(111,160,201,.92)}
body.mode-delivered .brand h1,body.mode-delivered .brand small,
body.mode-all .brand h1,body.mode-all .brand small{color:#fff}
body.mode-received .brand h1{color:#103b34}
body.mode-received .brand small{color:#2d6259}
body.mode-received #shareCurrent{background:#dff6ef;border-color:#76c8b5;color:#075f56}
body.mode-delivered #shareCurrent{background:#f6e2e6;border-color:#d58d99;color:#7e2f3d}
body.mode-all #shareCurrent{background:#e1eff9;border-color:#8eb8da;color:#285f8b}
body.mode-received #showAllBtn{background:#ffffffc9}
body.mode-delivered #showAllBtn{background:#ffffffd9}
body.mode-all #showAllBtn{background:#244f73;color:#fff;border-color:#244f73}

body.mode-all .card.received{
  border:2px solid #5ebaa9;
  background:#f7fffc;
}
body.mode-all .card.delivered{
  border:2px solid #c58b96;
  background:#fff8fa;
  opacity:1;
}
body.mode-all .card.received .status.received{
  background:#087f73;color:#fff;
}
body.mode-all .card.delivered .status.delivered{
  background:#7e2f3d;color:#fff;
}
body.mode-received .card.received{
  background:#f8fffd;
}
body.mode-delivered .card.delivered{
  background:#fff8fa;
  opacity:1;
}
body.mode-delivered .status.delivered{
  background:#7e2f3d;color:#fff;
}
body.mode-received .status.received{
  background:#087f73;color:#fff;
}


body.mode-all .stat.received{
  background:#d8f5ef;
  border-color:#72c8b8;
  color:#075f56;
}
body.mode-all .stat.delivered{
  background:#f4dce1;
  border-color:#d08c99;
  color:#7e2f3d;
}
body.mode-all .stat.received span,
body.mode-all .stat.received b{color:#075f56}
body.mode-all .stat.delivered span,
body.mode-all .stat.delivered b{color:#7e2f3d}


/* Contenedores visuales más definidos */
.card{border-width:2px}
.stat{border-width:2px}
.chip{border-width:2px}
.iconbtn{border-width:2px}
.items{border-width:2px}
.action{border-width:2px}
.photoPick{border-width:2px}
.photoBox{border-width:2px}
.item-editor{border-width:2px}
.field input,.field textarea,.field select{border-width:2px}
.additem{border-width:2px}
.secondarySave{border-width:2px}
.closebtn{border-width:2px}
.miniConfirmCard{border-width:2px}
.miniConfirmActions button{border-width:2px}


/* Editor realmente flotante */
.modalback{
  align-items:center;
  justify-content:center;
  padding:18px;
  overflow:auto;
}
.sheet{
  width:min(720px,100%);
  max-height:calc(100vh - 36px);
  margin:auto;
  border-radius:28px;
  padding:16px 14px max(18px,env(safe-area-inset-bottom));
  overflow:auto;
}
@media(max-width:699px){
  .modalback{align-items:flex-start;padding:18px 14px 26px}
  .sheet{
    width:100%;
    max-height:none;
    min-height:auto;
    margin:0 auto 26px;
    border-radius:28px;
    overflow:visible;
  }
  .sheetfoot{
    position:static;
    background:#fff;
    padding-top:14px;
  }
}


/* Los dos botones superiores conservan siempre su identidad */
.statbtn.received{
  background:#d8f5ef !important;
  border-color:#69c9b8 !important;
  color:#075f56 !important;
}
.statbtn.received b,.statbtn.received span{color:#075f56 !important}
.statbtn.delivered{
  background:#f4dce1 !important;
  border-color:#d28d99 !important;
  color:#7e2f3d !important;
}
.statbtn.delivered b,.statbtn.delivered span{color:#7e2f3d !important}
.statbtn.received.selected{
  background:#bcebdd !important;
  border-color:#087f73 !important;
  box-shadow:0 12px 28px rgba(8,127,115,.22) !important;
}
.statbtn.delivered.selected{
  background:#e8bcc5 !important;
  border-color:#7e2f3d !important;
  box-shadow:0 12px 28px rgba(126,47,61,.22) !important;
}


/* Más identidad de estado */
body.mode-all .card.received,
body.mode-received .card.received{
  background:#d8f3e8 !important;
  border-color:#42ad92 !important;
}
body.mode-all .card.delivered,
body.mode-delivered .card.delivered{
  background:#efd3d9 !important;
  border-color:#a94f62 !important;
}
body.mode-all .status.received,
body.mode-received .status.received{
  background:#168c72 !important;color:#fff !important;
}
body.mode-all .status.delivered,
body.mode-delivered .status.delivered{
  background:#8e3549 !important;color:#fff !important;
}


.sheethead{
  position:sticky;top:0;z-index:3;background:#fff;
  padding:4px 0 10px;margin-bottom:10px;border-bottom:2px solid var(--line)
}
#topSaveBtn{min-width:88px}


#undoBtn:disabled,#redoBtn:disabled{
  opacity:.35;filter:grayscale(.4);box-shadow:none;cursor:default
}


.card{
  transition:transform .26s ease;
}
@media (prefers-reduced-motion: reduce){
  .card{transition:none}
}


.pricesSheet{width:min(620px,100%)}
.pricesList{display:grid;gap:10px}
.priceRow{
  display:grid;grid-template-columns:1fr 150px;gap:10px;align-items:center;
  background:#f7f9fa;border:2px solid var(--line);border-radius:18px;padding:11px 12px
}
.priceRow label{font-size:14px;font-weight:900;color:#2e3439}
.priceInputWrap{
  display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);
  border-radius:14px;padding:0 10px
}
.priceInputWrap span{font-size:14px;font-weight:900;color:#68717c}
.priceInputWrap input{
  width:100%;border:0;background:transparent;padding:11px 0;outline:none;
  font-size:16px;font-weight:900;text-align:right
}
@media(max-width:480px){
  .priceRow{grid-template-columns:1fr 125px}
}


.item-editor{
  grid-template-columns:1.3fr .65fr 1fr auto;
}
.stamp-select{
  grid-column:1/-1;
  width:100%;
  border:2px solid var(--line);
  border-radius:13px;
  padding:10px 11px;
  background:#fff;
  font-weight:800;
}
@media(max-width:520px){
  .item-editor{
    grid-template-columns:1.15fr .65fr 1fr auto;
  }
}


.workTotal{
  margin-top:10px;
  display:flex;
  align-items:baseline;
  gap:9px;
  flex-wrap:wrap;
}
.workTotal span{
  font-size:9px;
  font-weight:950;
  letter-spacing:.55px;
  color:rgba(20,35,33,.62);
}
.workTotal b{
  font-size:24px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.5px;
  color:#103b34;
}
body.mode-delivered .workTotal span,
body.mode-all .workTotal span{color:rgba(255,255,255,.72)}
body.mode-delivered .workTotal b,
body.mode-all .workTotal b{color:#fff}


.cameraSheet{width:min(560px,100%)}
.squareCamera{
  width:100%;
  aspect-ratio:1/1;
  position:relative;
  overflow:hidden;
  border:3px solid #111827;
  border-radius:24px;
  background:#0b0d10;
}
.squareCamera video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.cameraGuide{
  position:absolute;
  inset:12px;
  border:2px solid rgba(255,255,255,.78);
  border-radius:18px;
  pointer-events:none;
  box-shadow:0 0 0 999px rgba(0,0,0,.06);
}
.captureBtn{
  width:100%;
  margin-top:12px;
  border:0;
  border-radius:17px;
  padding:14px;
  background:#111827;
  color:#fff;
  font-size:14px;
  font-weight:950;
}


body.mode-received .workTotal b{color:#075f56}
body.mode-delivered .workTotal b{color:#fff3f5}
body.mode-all .workTotal b{color:#fff}
body.mode-delivered .workTotal span{color:#ffe4e9}
body.mode-all .workTotal span{color:#e7f2fb}


#cameraModal{z-index:220!important}
#cameraModal .sheet{position:relative;z-index:221}
#modal{z-index:120}
#pricesModal{z-index:160}


.cardStateBox{
  display:grid;
  justify-items:end;
  gap:7px;
  min-width:92px;
}
.cardAmount{
  font-size:17px;
  line-height:1;
  font-weight:950;
  letter-spacing:-.3px;
  white-space:nowrap;
}
.card.received .cardAmount{color:#087f73}
.card.delivered .cardAmount{color:#8e3549}
@media(max-width:390px){
  .cardAmount{font-size:15px}
  .cardStateBox{min-width:78px}
}


.budgetAction{
  background:#fff4d9;
  border-color:#e6bd66;
  color:#8a5a08;
}
body.mode-delivered .budgetAction,
body.mode-all .budgetAction{
  background:#fff1cf;
  border-color:#d9aa49;
  color:#7a4b00;
}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="toprow">
      <div class="brand">
        <h1>Gestor</h1>
        <small>Entradas y entregas de prendas</small>
        <div class="workTotal">
          <span id="workTotalLabel">TRABAJO EN CURSO</span>
          <b id="workTotalValue">$ 0</b>
        </div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="iconbtn" id="undoBtn" aria-label="Deshacer" title="Deshacer">↶</button>
        <button class="iconbtn" id="redoBtn" aria-label="Rehacer" title="Rehacer">↷</button>
        <button class="iconbtn" id="menuBtn" aria-label="Menú">⋯</button>
      </div>
    </div>
  </div>

  <div class="stats">
    <button class="stat received statbtn" data-state="received">
      <b id="receivedCount">0</b>
      <span>En mi poder</span>
    </button>
    <button class="stat delivered statbtn" data-state="delivered">
      <b id="deliveredCount">0</b>
      <span>Entregados</span>
    </button>
  </div>

  <div class="toolbar"><button class="chip" id="shareCurrent">Compartir</button><button class="chip" id="showAllBtn">Ver todos</button></div>

  <div class="section-title">
    <h2 id="listTitle">Prendas en mi poder</h2>
    <small id="listCount">0 registros</small>
  </div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="Nuevo ingreso">＋</button>

<div class="menu" id="menu">
  <button id="pricesBtn">Precios de estampado</button>
  <button id="exportBtn">Guardar respaldo</button>
  <button id="importBtn">Restaurar respaldo</button>
  <button id="clearDeliveredBtn">Eliminar entregados</button>
  <input type="file" id="importFile" accept=".zip,.json,application/zip,application/json" hidden>
</div>


</div>



<div class="modalback" id="cameraModal">
  <div class="sheet cameraSheet">
    <div class="sheethead">
      <div>
        <h2>Foto cuadrada</h2>

<script>
const KEY='recibidos_3dcd_v1';
const COUNTER_KEY='recibidos_3dcd_counter_v1';
const PRICES_KEY='recibidos_3dcd_estampados_precios_v1';

const $=s=>document.querySelector(s);
const listEl=$('#list');
const modal=$('#modal');
const menu=$('#menu');

let records=[];
let undoStack=[];
let redoStack=[];
const HISTORY_LIMIT=5;
let activeFilter='received';
let editingId=null;
let draftPhoto='';
let draftItems=[];
let cameraStream=null;
const STAMP_TYPES=[
  '1 chico',
  '2 chicos',
  '3 chicos',
  '1 grande',
  '1 grande + 1 chico',
  '1 grande + 2 chicos'
];
let prices={};

const nowIso=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fmtDate(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return '—';
  return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);
}
function nextNumber(){
  let n=Number(localStorage.getItem(COUNTER_KEY)||1);
  localStorage.setItem(COUNTER_KEY,String(n+1));
  return n;
}

function snapshot(){
  return JSON.stringify(records);
}
function restoreSnapshot(raw){
  try{
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed)){
      records=parsed;
      localStorage.setItem(KEY,JSON.stringify(records));
      render();
      return true;
    }
  }catch{}
  return false;
}
function pushHistory(){
  undoStack.push(snapshot());
  if(undoStack.length>HISTORY_LIMIT)undoStack.shift();
  redoStack=[];
  updateHistoryButtons();
}
function updateHistoryButtons(){
  const u=$('#undoBtn'),r=$('#redoBtn');
  if(u)u.disabled=undoStack.length===0;
  if(r)r.disabled=redoStack.length===0;
}
function undo(){
  if(!undoStack.length)return;
  redoStack.push(snapshot());
  if(redoStack.length>HISTORY_LIMIT)redoStack.shift();
  const prev=undoStack.pop();
  restoreSnapshot(prev);
  updateHistoryButtons();
}
function redo(){
  if(!redoStack.length)return;
  undoStack.push(snapshot());
  if(undoStack.length>HISTORY_LIMIT)undoStack.shift();
  const next=redoStack.pop();
  restoreSnapshot(next);
  updateHistoryButtons();
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(records));
  render();
}
function load(){
  try{
    records=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(records))records=[];
  }catch{records=[]}
  records.forEach(r=>{
    if(!r.receivedAt)r.receivedAt=r.createdAt||nowIso();
    (r.items||[]).forEach(i=>{if(!i.stamp)i.stamp='1 chico'});
  });
  const max=Math.max(0,...records.map(r=>Number(r.numero||0)));
  const stored=Number(localStorage.getItem(COUNTER_KEY)||1);
  if(stored<=max)localStorage.setItem(COUNTER_KEY,String(max+1));
  render();
}

function loadPrices(){
  try{
    const x=JSON.parse(localStorage.getItem(PRICES_KEY)||'{}');
    prices=x&&typeof x==='object'?x:{};
  }catch{prices={}}
  STAMP_TYPES.forEach(t=>{if(prices[t]==null)prices[t]=''});
}
function renderPrices(){
  $('#pricesList').innerHTML=STAMP_TYPES.map(type=>`
    <div class="priceRow">
      <label>${esc(type)}</label>
      <div class="priceInputWrap">
        <span>$</span>
        <input data-price="${esc(type)}" type="number" min="0" step="100" inputmode="numeric" value="${esc(prices[type]??'')}" placeholder="0">
      </div>
    </div>
  `).join('');
}
function openPrices(){
  loadPrices();
  renderPrices();
  $('#pricesModal').classList.add('show');
  menu.classList.remove('show');
}
function closePrices(){
  $('#pricesModal').classList.remove('show');
}
function savePrices(){
  const next={};
  $('#pricesList').querySelectorAll('[data-price]').forEach(inp=>{
    next[inp.dataset.price]=inp.value===''?'':Math.max(0,Number(inp.value||0));
  });
  prices=next;
  localStorage.setItem(PRICES_KEY,JSON.stringify(prices));
  render();
  updateDraftValue();
  closePrices();
}


function stampPrice(type){
  const v=Number(prices[type]||0);
  return Number.isFinite(v)?v:0;
}


function moneyAR(n){
  return '$ '+Math.round(Number(n||0)).toLocaleString('es-AR');
}
function recordValue(r){
  return (r.items||[]).reduce((sum,i)=>{
    return sum+(Math.max(0,Number(i.qty||0))*stampPrice(i.stamp));
  },0);
}
function statusWorkTotal(status){
  return records
    .filter(r=>status==='all' || r.status===status)
    .reduce((sum,r)=>sum+recordValue(r),0);
}
function currentViewMoney(){
  if(activeFilter==='received'){
    return {label:'TRABAJO EN CURSO',value:statusWorkTotal('received')};
  }
  if(activeFilter==='delivered'){
    return {label:'PARA COBRAR',value:statusWorkTotal('delivered')};
  }
  return {label:'TOTAL GENERAL',value:statusWorkTotal('all')};
}

function statusLabel(r){return r.status==='delivered'?'Entregado':'Recibido'}
function itemSummary(r){
  const items=Array.isArray(r.items)?r.items:[];
  if(!items.length)return 'Sin prendas detalladas';
  return items.map(i=>`${i.qty||1} ${i.type||'prenda'}${i.color?' · '+i.color:''}${i.stamp?' · '+i.stamp:''}`).join(' / ');
}
function totalUnits(r){
  return (r.items||[]).reduce((a,i)=>a+Number(i.qty||0),0);
}
function filtered(){
  if(activeFilter==='all')return [...records].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return records.filter(r=>r.status===activeFilter).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}
function render(){
  const received=records.filter(r=>r.status==='received').length;
  const delivered=records.filter(r=>r.status==='delivered').length;
  $('#receivedCount').textContent=received;
  $('#deliveredCount').textContent=delivered;
    const moneyState=currentViewMoney();
  $('#workTotalLabel').textContent=moneyState.label;
  $('#workTotalValue').textContent=moneyAR(moneyState.value);

  const data=filtered();
  $('#listCount').textContent=`${data.length} registro${data.length===1?'':'s'}`;
  $('#listTitle').textContent=activeFilter==='received'?'Prendas en mi poder':activeFilter==='delivered'?'Entregados':'Todos los movimientos';

  document.body.classList.remove('mode-received','mode-delivered','mode-all');
  document.body.classList.add(activeFilter==='received'?'mode-received':activeFilter==='delivered'?'mode-delivered':'mode-all');
  document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('selected',b.dataset.state===activeFilter));
  $('#showAllBtn').classList.toggle('active',activeFilter==='all');
  $('#shareCurrent').style.display='inline-flex';

  if(!data.length){
    listEl.innerHTML=`<div class="empty">${activeFilter==='received'?'No tenés prendas pendientes registradas. Tocá ＋ cuando recibas una bolsa.':'No hay registros para mostrar.'}</div>`;
    return;
  }

  listEl.innerHTML=data.map(r=>`
    <article class="card ${r.status}" data-id="${r.id}">
      <div class="cardhead">
        <div class="thumb">${r.photo?`<img src="${r.photo}" alt="Foto">`:'📦'}</div>
        <div class="client">
          <h3>${esc(r.client||'Sin cliente')}</h3>
          <p>${esc(itemSummary(r))}<br>${fmtDate(r.status==='delivered'?(r.deliveredAt||r.createdAt):(r.receivedAt||r.createdAt))}</p>
        </div>
        <div class="cardStateBox">
          <b class="cardAmount">${moneyAR(recordValue(r))}</b>
          <span class="status ${r.status}">${statusLabel(r)}</span>
        </div>
      </div>
      <div class="cardbody">
        <div class="items">
          ${(r.items||[]).map(i=>`<div class="itemrow"><strong>${esc(i.type||'Prenda')}</strong><span>${esc(i.qty||1)} u.${i.color?' · '+esc(i.color):''}${i.stamp?' · '+esc(i.stamp):''}</span></div>`).join('')}
        </div>
        ${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}
        <div class="actions">
          
          <button class="action budgetAction" data-act="budget">Presupuesto</button>
          <button class="action" data-act="edit">Editar</button>
          ${r.status==='received'
            ?`<button class="action primary" data-act="deliver">Marcar entregado</button>`
            :`<button class="action gray" data-act="reopen">Volver a recibido</button>`}
          <button class="action danger" data-act="delete">Eliminar</button>
        </div>
      </div>
    </article>
  `).join('');
}

function newItem(){
  return {type:'Chomba',qty:'',color:'',stamp:'1 chico'};
}
function renderItemsEditor(){
  if(!draftItems.length)draftItems=[newItem()];
  $('#itemsEditor').innerHTML=draftItems.map((it,idx)=>`
    <div class="item-editor" data-idx="${idx}">
      <select data-k="type">
        ${['Chomba','Remera','Buzo','Buzo con capucha','Polar','Campera','Pantalón','Bombacha','Otra'].map(x=>`<option ${it.type===x?'selected':''}>${x}</option>`).join('')}
      </select>
      <input data-k="qty" type="number" min="1" step="1" value="${esc(it.qty??'')}" inputmode="numeric" placeholder="Cant.">
      <input data-k="color" value="${esc(it.color||'')}" placeholder="Color">
      <button class="removeitem" data-remove="${idx}" aria-label="Eliminar">×</button>
      <select class="stamp-select" data-k="stamp">
        ${STAMP_TYPES.map(x=>`<option ${it.stamp===x?'selected':''}>${x}</option>`).join('')}
      </select>
    </div>
  `).join('');
  updateDraftValue();
}

function draftValue(){
  return (draftItems||[]).reduce((sum,i)=>{
    if(!i)return sum;
    const raw=String(i.qty??'').trim();
    const effectiveQty=raw==='' ? 1 : Math.max(1,Number(raw)||1);
    return sum+(effectiveQty*stampPrice(i.stamp||'1 chico'));
  },0);
}
function updateDraftValue(){
  const el=$('#draftTotal');
  if(el)el.textContent=moneyAR(draftValue());
}

function renderDraftPhoto(){
  $('#photoBox').innerHTML=draftPhoto?`<img src="${draftPhoto}" alt="Foto">`:'Sin foto';
}
function openNew(){
  editingId=null;
  draftPhoto='';
  draftItems=[newItem()];
  $('#client').value='';
  $('#notes').value='';
  $('#sheetTitle').textContent='Nuevo ingreso';
  renderItemsEditor();
  renderDraftPhoto();
  modal.classList.add('show');
  setTimeout(()=>$('#client').focus(),120);
}
function openEdit(r){
  editingId=r.id;
  draftPhoto=r.photo||'';
  draftItems=(r.items||[]).map(i=>({...i}));
  $('#client').value=r.client||'';
  $('#notes').value=r.notes||'';
  $('#sheetTitle').textContent='Editar ingreso';
  renderItemsEditor();
  renderDraftPhoto();
  modal.classList.add('show');
}
function closeModal(){
  modal.classList.remove('show');
}
async function compressImage(file){
  const data=await new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=reject;
    fr.readAsDataURL(file);
  });
  const img=await new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=data;
  });

  const size=720;
  const c=document.createElement('canvas');
  c.width=size;c.height=size;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);

  const scale=Math.max(size/img.width,size/img.height);
  const w=img.width*scale,h=img.height*scale;
  const x=(size-w)/2,y=(size-h)/2;
  ctx.drawImage(img,x,y,w,h);
  return c.toDataURL('image/jpeg',.78);
}
async function pickPhoto(file){
  if(!file)return;
  try{
    draftPhoto=await compressImage(file);
    renderDraftPhoto();
  }catch{
    alert('No se pudo leer esa imagen.');
  }
}
function collectDraft(){
  const client=$('#client').value.trim()||'Cliente';
  const items=draftItems
    .map(i=>({
      type:String(i.type||'Prenda').trim(),
      qty:Math.max(1,Number(i.qty||1)),
      color:String(i.color||'').trim(),
      stamp:String(i.stamp||'1 chico')
    }))
    .filter(i=>i.type);
  if(!items.length){alert('Agregá al menos una prenda.');return null}
  return {client,items,notes:$('#notes').value.trim(),photo:draftPhoto};
}
function saveDraft(){
  const data=collectDraft();
  if(!data)return null;

  pushHistory();
  let r=editingId?records.find(x=>x.id===editingId):null;
  if(!r){
    r={
      id:uid(),
      numero:nextNumber(),
      createdAt:nowIso(),
      receivedAt:nowIso(),
      deliveredAt:null,
      status:'received'
    };
    records.unshift(r);
  }
  Object.assign(r,data);
  save();
  return r;
}
function textForRecord(r){
  const lines=(r.items||[]).map(i=>`• ${i.qty} ${i.type}${i.color?' · '+i.color:''}${i.stamp?' · '+i.stamp:''}`);
  return `${r.status==='delivered'?'ENTREGADO':'RECIBIDO'}\nCliente: ${r.client}\n${lines.join('\n')}${r.notes?`\nObs.: ${r.notes}`:''}\n${new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date(r.status==='delivered'?(r.deliveredAt||r.createdAt):(r.receivedAt||r.createdAt)))}`;
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){const words=String(text||'').split(/\s+/).filter(Boolean);let line='',lines=0;for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight;lines++;if(lines>=maxLines-1)break}else line=test}if(line&&lines<maxLines){ctx.fillText(line,x,y);y+=lineHeight}return y}
async function imgData(src){if(!src)return null;return await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src})}
async function recordCardBlob(r){
 const W=900,H=1280,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d'),rec=r.status!=='delivered';
 ctx.clearRect(0,0,W,H);
 const accent=rec?'#087f73':'#7e2f3d',soft=rec?'#eefbf7':'#fff4f6';
 const x=34,y=34,w=832,h=1188,radius=42;
 ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=28;ctx.shadowOffsetY=10;ctx.fillStyle='#fff';rr(ctx,x,y,w,h,radius);ctx.fill();ctx.restore();
 ctx.strokeStyle=accent;ctx.lineWidth=4;rr(ctx,x,y,w,h,radius);ctx.stroke();

 ctx.fillStyle=soft;rr(ctx,x+18,y+18,w-36,150,30);ctx.fill();
 ctx.fillStyle=accent;ctx.font='900 32px Arial';ctx.fillText('Gestor',x+44,y+64);
 ctx.font='900 24px Arial';ctx.fillText(rec?'EN MI PODER':'ENTREGADO',x+44,y+101);
 ctx.font='700 18px Arial';ctx.fillStyle='#65706f';ctx.fillText(fmtDate(rec?(r.receivedAt||r.createdAt):(r.deliveredAt||r.createdAt)),x+44,y+132);

 let cy=y+205;
 const im=await imgData(r.photo);
 if(im){
   const ps=190,px=x+44,py=cy;
   ctx.fillStyle='#edf1f3';rr(ctx,px,py,ps,ps,26);ctx.fill();
   ctx.save();rr(ctx,px,py,ps,ps,26);ctx.clip();
   const sc=Math.max(ps/im.width,ps/im.height),iw=im.width*sc,ih=im.height*sc;
   ctx.drawImage(im,px+(ps-iw)/2,py+(ps-ih)/2,iw,ih);ctx.restore();
   ctx.fillStyle='#15171a';ctx.font='900 34px Arial';
   let nameY=wrap(ctx,r.client||'Sin cliente',px+220,py+38,520,38,3);
   ctx.fillStyle='#68717c';ctx.font='700 20px Arial';
   wrap(ctx,itemSummary(r),px+220,nameY+8,520,27,4);
   cy=py+220;
 }else{
   ctx.fillStyle='#15171a';ctx.font='900 36px Arial';
   cy=wrap(ctx,r.client||'Sin cliente',x+44,cy+10,w-88,40,3)+10;
   ctx.fillStyle='#68717c';ctx.font='700 20px Arial';
   cy=wrap(ctx,itemSummary(r),x+44,cy,w-88,28,4)+12;
 }

 const items=r.items||[];
 const boxH=Math.max(170,80+items.length*64);
 ctx.fillStyle='#f7f9fa';rr(ctx,x+34,cy,w-68,boxH,26);ctx.fill();
 ctx.strokeStyle='#dce3e7';ctx.lineWidth=2;rr(ctx,x+34,cy,w-68,boxH,26);ctx.stroke();
 let iy=cy+52;
 for(const it of items){
   ctx.fillStyle='#15171a';ctx.font='900 24px Arial';
   const label=`${it.type||'Prenda'}${it.color?' · '+it.color:''}`;
   const nextY=wrap(ctx,label,x+58,iy,510,29,2);
   ctx.fillStyle=accent;ctx.font='900 22px Arial';ctx.textAlign='right';
   ctx.fillText(`${it.qty||1} u.`,x+w-70,iy);ctx.textAlign='left';
   iy=Math.max(nextY,iy+44)+14;
 }
 cy=cy+boxH+28;
 if(r.notes){
   ctx.fillStyle='#68717c';ctx.font='800 17px Arial';ctx.fillText('OBSERVACIÓN',x+44,cy);
   ctx.fillStyle='#34383d';ctx.font='500 21px Arial';wrap(ctx,r.notes,x+44,cy+30,w-88,29,5);
 }
 ctx.fillStyle='#7b8388';ctx.font='700 16px Arial';ctx.fillText(`Registro N° ${String(r.numero).padStart(3,'0')}`,x+44,y+h-42);
 return await new Promise(res=>c.toBlob(res,'image/png',.96))
}

function shortStamp(v){
  if(!v)return '';
  try{
    return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(v));
  }catch{return ''}
}

async function currentCardBlob(){
 const data=viewRecords();
 const received=data.filter(r=>r.status==='received');
 const delivered=data.filter(r=>r.status==='delivered');

 const W=900,headH=190,recvH=230,recvGap=18,delH=120,delGap=12,totalH=150;
 const sectionsH=(received.length*(recvH+recvGap))+(delivered.length?(46+delivered.length*(delH+delGap)):0);
 const innerH=headH+42+sectionsH+totalH+92;
 const H=Math.max(760,innerH+56);
 const c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
 ctx.clearRect(0,0,W,H);

 const x=28,y=28,w=844,h=H-56;
 const isReceived=activeFilter==='received';
 const isDelivered=activeFilter==='delivered';
 const accent=isReceived?'#168c72':isDelivered?'#8e3549':'#285f8b';
 const headBg=isReceived?'#ddf4eb':isDelivered?'#f2dce1':'#e4f0f9';
 const headText=isReceived?'#0f6e5c':isDelivered?'#7d2f40':'#174f78';

 ctx.save();ctx.shadowColor='rgba(0,0,0,.18)';ctx.shadowBlur=26;ctx.shadowOffsetY=10;
 ctx.fillStyle='#fff';rr(ctx,x,y,w,h,42);ctx.fill();ctx.restore();
 ctx.strokeStyle=accent;ctx.lineWidth=4;rr(ctx,x,y,w,h,42);ctx.stroke();

async function shareBudget(r){
  const blob=await budgetCardBlob(r);
  const file=new File(
    [blob],
    `presupuesto-${String(r.numero||0).padStart(3,'0')}-${safeFilePart(r.client)}.png`,
    {type:'image/png'}
  );

  if(navigator.share){
    try{
      if(navigator.canShare?.({files:[file]})){
        await navigator.share({title:`Presupuesto - ${r.client||'Cliente'}`,files:[file]});
        return;
      }
    }catch(e){
      if(e?.name==='AbortError')return;
    }
  }

  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=file.name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1200);
}

function capturePositions(){
  const map=new Map();
  listEl.querySelectorAll('.card').forEach(el=>{
    map.set(el.dataset.id,el.getBoundingClientRect().top);
  });
  return map;
}
function animateReflow(before){
  if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches)return;
  requestAnimationFrame(()=>{
    listEl.querySelectorAll('.card').forEach(el=>{
      const oldTop=before.get(el.dataset.id);
      if(oldTop==null)return;
      const newTop=el.getBoundingClientRect().top;
      const dy=oldTop-newTop;
      if(Math.abs(dy)<1)return;
      el.style.transition='none';
      el.style.transform=`translateY(${dy}px)`;
      el.offsetHeight;
      el.style.transition='transform .28s ease';
      el.style.transform='translateY(0)';
      setTimeout(()=>{
        el.style.transition='';
        el.style.transform='';
      },300);
    });
  });
}

listEl.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const card=btn.closest('.card');
  const r=records.find(x=>String(x.id)===String(card?.dataset.id));
  if(!r)return;
  const act=btn.dataset.act;

  if(act==='budget'){await shareBudget(r);return}
  if(act==='edit'){openEdit(r);return}
  if(act==='deliver'){
    pushHistory();
    const before=capturePositions();
    r.status='delivered';
    r.deliveredAt=nowIso();
    save();
    animateReflow(before);
    return;
  }
  if(act==='reopen'){
    pushHistory();
    const before=capturePositions();
    r.status='received';
    r.receivedAt=nowIso();
    r.deliveredAt=null;
    save();
    animateReflow(before);
    return;
  }
  if(act==='delete'){
    if(!confirm(`¿Eliminar el registro de ${r.client}?`))return;
    pushHistory();
    records=records.filter(x=>x.id!==r.id);
    save();
  }
});

function backupStamp(){

let _crcTable=null;
function crc32(bytes){
  if(!_crcTable){
    _crcTable=new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c=n;
      for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);
      _crcTable[n]=c>>>0;
    }
  }
  let c=0xFFFFFFFF;
  for(const b of bytes)c=_crcTable[(c^b)&255]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function concatBytes(parts){
  const len=parts.reduce((a,b)=>a+b.length,0),out=new Uint8Array(len);
  let o=0;for(const b of parts){out.set(b,o);o+=b.length}return out;
}
function zipStore(files){
  const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;
  for(const f of files){
    const name=enc.encode(f.name),data=f.data instanceof Uint8Array?f.data:new Uint8Array(f.data),crc=crc32(data);
    const local=concatBytes([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
    locals.push(local);
    const central=concatBytes([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]);
    centrals.push(central);offset+=local.length;
  }
  const centralData=concatBytes(centrals);
  const end=concatBytes([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(centralData.length),u32(offset),u16(0)]);
  return new Blob([...locals,centralData,end],{type:'application/zip'});
}
function readU16(a,o){return a[o]|(a[o+1]<<8)}
function readU32(a,o){return (a[o]|(a[o+1]<<8)|(a[o+2]<<16)|(a[o+3]<<24))>>>0}
function unzipStored(arrayBuffer){
  const a=new Uint8Array(arrayBuffer),files={};let o=0;
  while(o+30<=a.length && readU32(a,o)===0x04034b50){
    const method=readU16(a,o+8),compSize=readU32(a,o+18),nameLen=readU16(a,o+26),extraLen=readU16(a,o+28);
    const name=new TextDecoder().decode(a.slice(o+30,o+30+nameLen));
    const dataStart=o+30+nameLen+extraLen;
    if(method!==0)throw new Error('ZIP comprimido no compatible');
    files[name]=a.slice(dataStart,dataStart+compSize);o=dataStart+compSize;
  }
  return files;
}

$('#importFile').onchange=async e=>{

  try{

      const files=unzipStored(await f.arrayBuffer());

    if(!confirm('¿Reemplazar los datos actuales por este respaldo?'))return;
    pushHistory();records=x.records;
    if(x.prices&&typeof x.prices==='object'){prices=x.prices;localStorage.setItem(PRICES_KEY,JSON.stringify(prices));}
    localStorage.setItem(COUNTER_KEY,String(Math.max(Number(x.nextNumber||1),Math.max(0,...records.map(r=>Number(r.numero||0)))+1)));
    save();
  }catch(err){console.error(err);alert('Ese archivo no parece ser un respaldo válido de Gestor.');}
  menu.classList.remove('show');
};
$('#clearDeliveredBtn').onclick=()=>{
  const n=records.filter(r=>r.status==='delivered').length;
  if(!n){alert('No hay entregados para eliminar.');return}
  if(!confirm(`¿Eliminar ${n} registro${n===1?'':'s'} entregado${n===1?'':'s'}?`))return;
  pushHistory();
  records=records.filter(r=>r.status!=='delivered');
  save();
  menu.classList.remove('show');
};

window.addEventListener('beforeunload',save);
load();loadPrices();render();updateHistoryButtons();
</script>
</body>
</html>
