<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f4f6">
<title>Recibidos 3DCD</title>
<style>
:root{
  --bg:#eef2f5;
  --card:#ffffff;
  --ink:#15171a;
  --muted:#68717c;
  --line:#dbe1e7;
  --shadow:0 12px 30px rgba(20,23,26,.10);

  --received:#087f73;
  --received-soft:#d8f5ef;
  --received-border:#a8e4d9;

  --delivered:#64748b;
  --delivered-soft:#e7edf3;
  --delivered-border:#ccd6e0;

  --accent:#1f2937;
  --accent-soft:#e7edf7;
  --warm:#d97706;
  --warm-soft:#fff1d6;
  --danger:#a52b2b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
body{padding-bottom:max(92px,env(safe-area-inset-bottom))}
.app{
  max-width:760px;
  margin:0 auto;
  padding:14px 14px 28px;
}
.top{
  position:sticky;
  top:0;
  z-index:20;
  margin:-14px -14px 12px;
  padding:max(12px,env(safe-area-inset-top)) 14px 12px;
  background:rgba(243,244,246,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(0,0,0,.04);
}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:24px;line-height:1;font-weight:950;letter-spacing:-.5px}
.brand small{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:700}
.iconbtn{
  width:44px;height:44px;border:1px solid var(--line);border-radius:16px;background:#fff;
  display:grid;place-items:center;font-size:20px;font-weight:900;box-shadow:0 4px 14px rgba(0,0,0,.05)
}
.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin:12px 0 14px;
}
.stat{
  border-radius:20px;
  padding:12px 14px;
  box-shadow:var(--shadow);
  border:1px solid transparent;
}
.stat.received{background:var(--received-soft);border-color:var(--received-border)}
.stat.delivered{background:var(--delivered-soft);border-color:var(--delivered-border)}
.stat b{display:block;font-size:26px;line-height:1;font-weight:950}
.stat span{display:block;margin-top:6px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.45px}
.toolbar{
  display:flex;gap:9px;overflow-x:auto;padding:4px 0 7px;scrollbar-width:none
}
.toolbar::-webkit-scrollbar{display:none}
.chip{
  white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;
  font-size:12px;font-weight:900;color:#30343a;box-shadow:0 3px 10px rgba(0,0,0,.04)
}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 14px rgba(31,41,55,.18)}
#shareCurrent{background:var(--warm-soft);border-color:#f0cf97;color:#9a5a06}
.section-title{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:16px 2px 10px;
}
.section-title h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.section-title small{color:var(--muted);font-size:11px;font-weight:700}
.list{display:grid;gap:12px}
.card{
  background:var(--card);
  border-radius:24px;
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card.received{border-left:5px solid var(--received)}
.card.delivered{border-left:5px solid var(--delivered);opacity:.86}
.cardhead{
  display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;
  padding:12px;
}
.thumb{
  width:62px;height:62px;border-radius:17px;overflow:hidden;background:#eef1f4;border:1px solid var(--line);
  display:grid;place-items:center;color:#a0a5ac;font-size:22px;font-weight:900
}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.client{min-width:0}
.client h3{
  margin:0;font-size:18px;line-height:1.1;font-weight:950;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.client p{
  margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.35;font-weight:650
}
.status{
  border-radius:999px;padding:7px 9px;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.35px
}
.status.received{background:var(--received-soft);color:var(--received)}
.status.delivered{background:var(--delivered-soft);color:var(--delivered)}
.cardbody{padding:0 12px 14px}
.items{
  background:#f6f8fa;border:1px solid #e3e8ee;border-radius:17px;padding:11px 12px;
  display:grid;gap:8px
}
.itemrow{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.itemrow strong{font-weight:900}
.itemrow span{color:var(--muted);font-weight:650;text-align:right}
.notes{font-size:12px;color:#4d5259;line-height:1.45;margin-top:9px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.action{
  min-height:44px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 13px;
  font-size:12px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.035)
}
.action.primary{background:var(--received);border-color:var(--received);color:#fff}
.action.gray{background:var(--delivered);border-color:var(--delivered);color:#fff}
.action.danger{color:var(--danger)}
.fab{
  position:fixed;
  right:max(18px,env(safe-area-inset-right));
  bottom:max(18px,env(safe-area-inset-bottom));
  z-index:30;
  width:64px;height:64px;border-radius:22px;border:0;background:linear-gradient(145deg,#263547,#111827);color:#fff;
  font-size:34px;line-height:1;font-weight:400;box-shadow:0 16px 35px rgba(17,24,39,.32)
}
.empty{
  background:#fff;border:1px dashed #d4d8dd;border-radius:22px;padding:26px 18px;text-align:center;color:var(--muted);
  font-size:13px;line-height:1.5
}

.modalback{
  position:fixed;inset:0;z-index:100;background:rgba(16,18,20,.38);
  display:none;align-items:flex-end;justify-content:center
}
.modalback.show{display:flex}
.sheet{
  width:min(760px,100%);
  max-height:94vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:16px 14px max(18px,env(safe-area-inset-bottom));
  box-shadow:0 -16px 50px rgba(0,0,0,.2)
}
.dragbar{width:54px;height:5px;border-radius:999px;background:#d7dbe0;margin:2px auto 14px}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheethead h2{margin:0;font-size:21px;font-weight:950}
.closebtn{width:42px;height:42px;border-radius:15px;border:1px solid var(--line);background:#fff;font-size:18px;font-weight:900}
.form{display:grid;gap:12px}
.field{display:grid;gap:6px}
.field label{font-size:10px;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.45px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:#fff;border-radius:17px;padding:13px 14px;font-size:15px;outline:none;
}
.field textarea{min-height:76px;resize:vertical}
.photoPick{
  display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;
  padding:11px;border:1px solid #d8e0e7;border-radius:20px;background:#f4f7f9
}
.photoBox{
  width:92px;height:92px;border-radius:20px;overflow:hidden;background:#e9edf1;border:1px solid var(--line);
  display:grid;place-items:center;color:#81868d;font-weight:900;font-size:11px;text-align:center;padding:8px
}
.photoBox img{width:100%;height:100%;object-fit:cover}
.photoActions{display:grid;gap:8px}
.bigbtn{
  border:0;border-radius:16px;padding:13px 14px;font-size:13px;font-weight:950
}
.bigbtn.camera{background:var(--accent);color:#fff}
.bigbtn.gallery{background:#fff;border:1px solid var(--line);color:#30343a}
.item-editor{
  display:grid;grid-template-columns:1.5fr .8fr 1fr auto;gap:8px;align-items:end;
  background:#f5f8fa;border:1px solid #dfe6ec;border-radius:18px;padding:11px
}
.item-editor input,.item-editor select{width:100%;border:1px solid var(--line);border-radius:13px;padding:10px 11px;background:#fff}
.removeitem{width:40px;height:40px;border-radius:13px;border:1px solid #ead7d7;background:#fff;color:var(--danger);font-weight:950}
.additem{
  border:1px dashed #bfc5cc;background:#fff;border-radius:15px;padding:11px 12px;font-size:12px;font-weight:900;color:#3d4248
}
.sheetfoot{
  position:sticky;bottom:0;background:linear-gradient(to top,#fff 75%,rgba(255,255,255,0));
  padding-top:14px;margin-top:6px;display:grid;grid-template-columns:1fr 1.3fr;gap:8px
}
.secondarySave{border:1px solid var(--line);background:#fff;border-radius:17px;padding:14px;font-weight:900}
.primarySave{border:0;background:var(--received);color:#fff;border-radius:17px;padding:14px;font-weight:950}

.menu{
  position:fixed;z-index:120;top:68px;right:14px;width:220px;background:#fff;border:1px solid var(--line);
  border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.16);padding:8px;display:none
}
.menu.show{display:grid;gap:4px}
.menu button{border:0;background:#fff;border-radius:14px;text-align:left;padding:12px 11px;font-size:12px;font-weight:850}
.menu button:hover{background:#f6f7f8}
.hidden{display:none!important}

@media(min-width:700px){
  .fab{right:calc((100vw - 760px)/2 + 18px)}
  .sheet{margin-bottom:16px;border-radius:28px}
  .modalback{align-items:center;padding:20px}
  .stats{grid-template-columns:repeat(2,180px);justify-content:start}
}

body.mode-received{background:linear-gradient(180deg,#e8f8f3 0,#eef2f5 300px,#eef2f5 100%)}
body.mode-delivered{background:linear-gradient(180deg,#e9eef4 0,#eef2f5 300px,#eef2f5 100%)}
body.mode-all{background:linear-gradient(180deg,#fff3df 0,#eef2f5 300px,#eef2f5 100%)}
.statbtn{appearance:none;text-align:left;width:100%;cursor:pointer;transition:.18s;outline:none}
.statbtn.selected{transform:translateY(-2px)}
.statbtn.received.selected{border-color:#5bc4b6;box-shadow:0 14px 34px rgba(8,127,115,.20)}
.statbtn.delivered.selected{border-color:#aebdca;box-shadow:0 14px 34px rgba(100,116,139,.20)}
.statbtn:active{transform:scale(.985)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="toprow">
      <div class="brand">
        <h1>Recibidos 3DCD</h1>
        <small>Entradas y entregas de prendas</small>
      </div>
      <button class="iconbtn" id="menuBtn" aria-label="Menú">⋯</button>
    </div>
  </div>

  <div class="stats">
    <button class="stat received statbtn" data-state="received">
      <b id="receivedCount">0</b>
      <span>En mi poder</span>
    </button>
    <button class="stat delivered statbtn" data-state="delivered">
      <b id="deliveredCount">0</b>
      <span>Entregados</span>
    </button>
  </div>

  <div class="toolbar"><button class="chip" id="shareCurrent">Compartir estado actual</button><button class="chip" id="showAllBtn">Ver todos</button></div>

  <div class="section-title">
    <h2 id="listTitle">Prendas en mi poder</h2>
    <small id="listCount">0 registros</small>
  </div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="addBtn" aria-label="Nuevo ingreso">＋</button>

<div class="menu" id="menu">
  <button id="exportBtn">Exportar respaldo</button>
  <button id="importBtn">Importar respaldo</button>
  <button id="clearDeliveredBtn">Eliminar entregados</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<div class="modalback" id="modal">
  <div class="sheet">
    <div class="dragbar"></div>
    <div class="sheethead">
      <h2 id="sheetTitle">Nuevo ingreso</h2>
      <button class="closebtn" id="closeBtn">×</button>
    </div>

    <div class="form">
      <div class="field">
        <label>Cliente</label>
        <input id="client" autocomplete="off" placeholder="Nombre del cliente">
      </div>

      <div class="photoPick">
        <div class="photoBox" id="photoBox">Sin foto</div>
        <div class="photoActions">
          <button class="bigbtn camera" id="cameraBtn">📷 Sacar foto</button>
          <button class="bigbtn gallery" id="galleryBtn">Elegir imagen</button>
        </div>
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
        <input id="galleryInput" type="file" accept="image/*" hidden>
      </div>

      <div class="field">
        <label>Prendas recibidas</label>
        <div id="itemsEditor" style="display:grid;gap:8px"></div>
        <button class="additem" id="addItemBtn">＋ Agregar otra prenda</button>
      </div>

      <div class="field">
        <label>Observación breve</label>
        <textarea id="notes" placeholder="Ej: bolsa negra, falta confirmar un talle..."></textarea>
      </div>

      <div class="sheetfoot">
        <button class="secondarySave" id="saveOnlyBtn">Guardar</button>
        <button class="primarySave" id="saveShareBtn">Guardar y compartir</button>
      </div>
    </div>
  </div>
</div>

<script>
const KEY='recibidos_3dcd_v1';
const COUNTER_KEY='recibidos_3dcd_counter_v1';

const $=s=>document.querySelector(s);
const listEl=$('#list');
const modal=$('#modal');
const menu=$('#menu');

let records=[];
let activeFilter='received';
let editingId=null;
let draftPhoto='';
let draftItems=[];

const nowIso=()=>new Date().toISOString();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fmtDate(iso){
  const d=new Date(iso);
  if(Number.isNaN(d.getTime())) return '—';
  return new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d);
}
function nextNumber(){
  let n=Number(localStorage.getItem(COUNTER_KEY)||1);
  localStorage.setItem(COUNTER_KEY,String(n+1));
  return n;
}
function save(){
  localStorage.setItem(KEY,JSON.stringify(records));
  render();
}
function load(){
  try{
    records=JSON.parse(localStorage.getItem(KEY)||'[]');
    if(!Array.isArray(records))records=[];
  }catch{records=[]}
  const max=Math.max(0,...records.map(r=>Number(r.numero||0)));
  const stored=Number(localStorage.getItem(COUNTER_KEY)||1);
  if(stored<=max)localStorage.setItem(COUNTER_KEY,String(max+1));
  render();
}
function statusLabel(r){return r.status==='delivered'?'Entregado':'Recibido'}
function itemSummary(r){
  const items=Array.isArray(r.items)?r.items:[];
  if(!items.length)return 'Sin prendas detalladas';
  return items.map(i=>`${i.qty||1} ${i.type||'prenda'}${i.color?' · '+i.color:''}`).join(' / ');
}
function totalUnits(r){
  return (r.items||[]).reduce((a,i)=>a+Number(i.qty||0),0);
}
function filtered(){
  if(activeFilter==='all')return [...records].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  return records.filter(r=>r.status===activeFilter).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}
function render(){
  const received=records.filter(r=>r.status==='received').length;
  const delivered=records.filter(r=>r.status==='delivered').length;
  $('#receivedCount').textContent=received;
  $('#deliveredCount').textContent=delivered;

  const data=filtered();
  $('#listCount').textContent=`${data.length} registro${data.length===1?'':'s'}`;
  $('#listTitle').textContent=activeFilter==='received'?'Prendas en mi poder':activeFilter==='delivered'?'Entregados':'Todos los movimientos';

  document.body.classList.remove('mode-received','mode-delivered','mode-all');
  document.body.classList.add(activeFilter==='received'?'mode-received':activeFilter==='delivered'?'mode-delivered':'mode-all');
  document.querySelectorAll('[data-state]').forEach(b=>b.classList.toggle('selected',b.dataset.state===activeFilter));
  $('#showAllBtn').classList.toggle('active',activeFilter==='all');

  if(!data.length){
    listEl.innerHTML=`<div class="empty">${activeFilter==='received'?'No tenés prendas pendientes registradas. Tocá ＋ cuando recibas una bolsa.':'No hay registros para mostrar.'}</div>`;
    return;
  }

  listEl.innerHTML=data.map(r=>`
    <article class="card ${r.status}" data-id="${r.id}">
      <div class="cardhead">
        <div class="thumb">${r.photo?`<img src="${r.photo}" alt="Foto">`:'📦'}</div>
        <div class="client">
          <h3>${esc(r.client||'Sin cliente')}</h3>
          <p>${esc(itemSummary(r))}<br>${fmtDate(r.createdAt)}</p>
        </div>
        <span class="status ${r.status}">${statusLabel(r)}</span>
      </div>
      <div class="cardbody">
        <div class="items">
          ${(r.items||[]).map(i=>`<div class="itemrow"><strong>${esc(i.type||'Prenda')}</strong><span>${esc(i.qty||1)} u.${i.color?' · '+esc(i.color):''}</span></div>`).join('')}
        </div>
        ${r.notes?`<div class="notes">${esc(r.notes)}</div>`:''}
        <div class="actions">
          <button class="action" data-act="share">Compartir</button>
          <button class="action" data-act="edit">Editar</button>
          ${r.status==='received'
            ?`<button class="action primary" data-act="deliver">Marcar entregado</button>`
            :`<button class="action gray" data-act="reopen">Volver a recibido</button>`}
          <button class="action danger" data-act="delete">Eliminar</button>
        </div>
      </div>
    </article>
  `).join('');
}

function newItem(){
  return {type:'Chomba',qty:'',color:''};
}
function renderItemsEditor(){
  if(!draftItems.length)draftItems=[newItem()];
  $('#itemsEditor').innerHTML=draftItems.map((it,idx)=>`
    <div class="item-editor" data-idx="${idx}">
      <select data-k="type">
        ${['Chomba','Remera','Buzo','Buzo con capucha','Polar','Campera','Pantalón','Bombacha','Otra'].map(x=>`<option ${it.type===x?'selected':''}>${x}</option>`).join('')}
      </select>
      <input data-k="qty" type="number" min="1" step="1" value="${esc(it.qty??'')}" inputmode="numeric" placeholder="Cant.">
      <input data-k="color" value="${esc(it.color||'')}" placeholder="Color">
      <button class="removeitem" data-remove="${idx}" aria-label="Eliminar">×</button>
    </div>
  `).join('');
}
function renderDraftPhoto(){
  $('#photoBox').innerHTML=draftPhoto?`<img src="${draftPhoto}" alt="Foto">`:'Sin foto';
}
function openNew(){
  editingId=null;
  draftPhoto='';
  draftItems=[newItem()];
  $('#client').value='';
  $('#notes').value='';
  $('#sheetTitle').textContent='Nuevo ingreso';
  renderItemsEditor();
  renderDraftPhoto();
  modal.classList.add('show');
  setTimeout(()=>$('#client').focus(),120);
}
function openEdit(r){
  editingId=r.id;
  draftPhoto=r.photo||'';
  draftItems=(r.items||[]).map(i=>({...i}));
  $('#client').value=r.client||'';
  $('#notes').value=r.notes||'';
  $('#sheetTitle').textContent='Editar ingreso';
  renderItemsEditor();
  renderDraftPhoto();
  modal.classList.add('show');
}
function closeModal(){
  modal.classList.remove('show');
}
async function compressImage(file){
  const data=await new Promise((resolve,reject)=>{
    const fr=new FileReader();
    fr.onload=()=>resolve(fr.result);
    fr.onerror=reject;
    fr.readAsDataURL(file);
  });
  const img=await new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=data;
  });

  const size=720;
  const c=document.createElement('canvas');
  c.width=size;c.height=size;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);

  const scale=Math.max(size/img.width,size/img.height);
  const w=img.width*scale,h=img.height*scale;
  const x=(size-w)/2,y=(size-h)/2;
  ctx.drawImage(img,x,y,w,h);
  return c.toDataURL('image/jpeg',.78);
}
async function pickPhoto(file){
  if(!file)return;
  try{
    draftPhoto=await compressImage(file);
    renderDraftPhoto();
  }catch{
    alert('No se pudo leer esa imagen.');
  }
}
function collectDraft(){
  const client=$('#client').value.trim();
  if(!client){alert('Poné el nombre del cliente.');return null}
  const items=draftItems
    .map(i=>({type:String(i.type||'Prenda').trim(),qty:Math.max(1,Number(i.qty||1)),color:String(i.color||'').trim()}))
    .filter(i=>i.type);
  if(!items.length){alert('Agregá al menos una prenda.');return null}
  return {client,items,notes:$('#notes').value.trim(),photo:draftPhoto};
}
function saveDraft(){
  const data=collectDraft();
  if(!data)return null;

  let r=editingId?records.find(x=>x.id===editingId):null;
  if(!r){
    r={
      id:uid(),
      numero:nextNumber(),
      createdAt:nowIso(),
      deliveredAt:null,
      status:'received'
    };
    records.unshift(r);
  }
  Object.assign(r,data);
  save();
  return r;
}
function textForRecord(r){
  const lines=(r.items||[]).map(i=>`• ${i.qty} ${i.type}${i.color?' · '+i.color:''}`);
  return `${r.status==='delivered'?'ENTREGADO':'RECIBIDO'}\nCliente: ${r.client}\n${lines.join('\n')}${r.notes?`\nObs.: ${r.notes}`:''}\n${new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date(r.status==='delivered'&&r.deliveredAt?r.deliveredAt:r.createdAt))}`;
}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrap(ctx,text,x,y,maxWidth,lineHeight,maxLines=3){const words=String(text||'').split(/\s+/).filter(Boolean);let line='',lines=0;for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight;lines++;if(lines>=maxLines-1)break}else line=test}if(line&&lines<maxLines){ctx.fillText(line,x,y);y+=lineHeight}return y}
async function imgData(src){if(!src)return null;return await new Promise(res=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src})}
async function recordCardBlob(r){
 const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d'),rec=r.status!=='delivered';
 ctx.fillStyle=rec?'#e8f8f3':'#e9eef4';ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#fff';ctx.save();ctx.shadowColor='rgba(0,0,0,.12)';ctx.shadowBlur=34;ctx.shadowOffsetY=14;rr(ctx,54,54,972,1242,48);ctx.fill();ctx.restore();
 ctx.fillStyle=rec?'#087f73':'#64748b';rr(ctx,54,54,972,170,48);ctx.fill();ctx.fillRect(54,130,972,94);
 ctx.fillStyle='#fff';ctx.font='900 54px Arial';ctx.fillText(rec?'RECIBIDO':'ENTREGADO',95,123);ctx.font='700 25px Arial';ctx.fillStyle='rgba(255,255,255,.82)';ctx.fillText(fmtDate(rec?r.createdAt:(r.deliveredAt||r.createdAt)),95,168);
 let y=275;const im=await imgData(r.photo);
 if(im){const px=95,py=250,ps=235;ctx.fillStyle='#eef1f4';rr(ctx,px,py,ps,ps,32);ctx.fill();ctx.save();rr(ctx,px,py,ps,ps,32);ctx.clip();const sc=Math.max(ps/im.width,ps/im.height),iw=im.width*sc,ih=im.height*sc;ctx.drawImage(im,px+(ps-iw)/2,py+(ps-ih)/2,iw,ih);ctx.restore();ctx.fillStyle='#15171a';ctx.font='900 42px Arial';ctx.fillText(r.client||'Sin cliente',380,315);ctx.fillStyle='#68717c';ctx.font='700 24px Arial';wrap(ctx,itemSummary(r),380,360,570,32,3);y=535}else{ctx.fillStyle='#15171a';ctx.font='900 48px Arial';ctx.fillText(r.client||'Sin cliente',95,310);ctx.fillStyle='#68717c';ctx.font='700 25px Arial';wrap(ctx,itemSummary(r),95,355,860,34,3);y=465}
 const bh=Math.max(300,(r.items||[]).length*82+70);ctx.fillStyle='#f6f8fa';rr(ctx,95,y,890,bh,30);ctx.fill();let iy=y+65;
 for(const it of (r.items||[])){ctx.fillStyle='#15171a';ctx.font='900 28px Arial';ctx.fillText(it.type||'Prenda',130,iy);ctx.textAlign='right';ctx.fillStyle='#68717c';ctx.font='700 25px Arial';ctx.fillText(`${it.qty||1} u.${it.color?' · '+it.color:''}`,945,iy);ctx.textAlign='left';iy+=76}
 if(r.notes){iy+=18;ctx.fillStyle='#68717c';ctx.font='700 22px Arial';ctx.fillText('OBSERVACIÓN',95,iy);ctx.fillStyle='#34383d';ctx.font='500 25px Arial';wrap(ctx,r.notes,95,iy+38,850,34,4)}
 ctx.fillStyle='#7a8087';ctx.font='700 20px Arial';ctx.fillText(`Registro 3DCD · N° ${String(r.numero).padStart(3,'0')}`,95,1240);
 return await new Promise(res=>c.toBlob(res,'image/png',.96))
}
async function currentCardBlob(){
 const active=records.filter(r=>r.status==='received');const W=1080,rowH=125,H=Math.max(900,310+active.length*rowH+130),c=document.createElement('canvas');c.width=W;c.height=H;const ctx=c.getContext('2d');
 ctx.fillStyle='#e8f8f3';ctx.fillRect(0,0,W,H);ctx.fillStyle='#087f73';ctx.fillRect(0,0,W,210);ctx.fillStyle='#fff';ctx.font='900 50px Arial';ctx.fillText('PRENDAS EN MI PODER',65,88);ctx.font='700 25px Arial';ctx.fillStyle='rgba(255,255,255,.82)';ctx.fillText(new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date()),65,138);
 let y=270;for(const r of active){ctx.fillStyle='#fff';rr(ctx,55,y-35,970,100,25);ctx.fill();ctx.fillStyle='#15171a';ctx.font='900 28px Arial';ctx.fillText(r.client||'Sin cliente',88,y);ctx.fillStyle='#68717c';ctx.font='700 21px Arial';wrap(ctx,itemSummary(r),88,y+34,860,27,2);y+=rowH}
 if(!active.length){ctx.fillStyle='#fff';rr(ctx,55,280,970,180,28);ctx.fill();ctx.fillStyle='#68717c';ctx.font='800 28px Arial';ctx.fillText('No hay prendas pendientes.',90,370)}
 ctx.fillStyle='#61706e';ctx.font='800 21px Arial';ctx.fillText(`Ingresos pendientes: ${active.length} · Recibidos 3DCD`,65,H-65);
 return await new Promise(res=>c.toBlob(res,'image/png',.96))
}

async function shareRecord(r){
 const text=textForRecord(r),blob=await recordCardBlob(r),file=new File([blob],`3dcd-${r.status}-${String(r.numero).padStart(3,'0')}.png`,{type:'image/png'});
 if(navigator.share){try{if(navigator.canShare?.({files:[file]}))await navigator.share({title:`${statusLabel(r)} - ${r.client}`,text,files:[file]});else await navigator.share({title:`${statusLabel(r)} - ${r.client}`,text});return}catch(e){if(e?.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(text)}catch{}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)
}
function currentText(){
  const active=records.filter(r=>r.status==='received');
  if(!active.length)return 'Actualmente no tengo prendas pendientes en mi poder.';
  const rows=active.map(r=>`• ${r.client}: ${(r.items||[]).map(i=>`${i.qty} ${i.type}${i.color?' '+i.color:''}`).join(', ')}`);
  return `PRENDAS EN MI PODER\nActualizado ${new Intl.DateTimeFormat('es-AR',{dateStyle:'short',timeStyle:'short'}).format(new Date())}\n\n${rows.join('\n')}\n\nIngresos pendientes: ${active.length}`;
}
async function shareCurrent(){
 const text=currentText(),blob=await currentCardBlob(),file=new File([blob],`3dcd-prendas-en-mi-poder-${new Date().toISOString().slice(0,10)}.png`,{type:'image/png'});
 if(navigator.share){try{if(navigator.canShare?.({files:[file]}))await navigator.share({title:'Prendas en mi poder',text,files:[file]});else await navigator.share({title:'Prendas en mi poder',text});return}catch(e){if(e?.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(text)}catch{}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)
}

$('#addBtn').onclick=openNew;
$('#closeBtn').onclick=closeModal;
$('#cameraBtn').onclick=()=>$('#cameraInput').click();
$('#galleryBtn').onclick=()=>$('#galleryInput').click();
$('#cameraInput').onchange=e=>{pickPhoto(e.target.files?.[0]);e.target.value=''};
$('#galleryInput').onchange=e=>{pickPhoto(e.target.files?.[0]);e.target.value=''};

$('#addItemBtn').onclick=()=>{
  draftItems.push(newItem());
  renderItemsEditor();
};
$('#itemsEditor').addEventListener('focusin',e=>{
  if(e.target.dataset.k==='qty'){
    setTimeout(()=>e.target.select(),0);
  }
});
$('#itemsEditor').addEventListener('input',e=>{
  const row=e.target.closest('.item-editor');
  if(!row)return;
  const idx=Number(row.dataset.idx);
  const k=e.target.dataset.k;
  if(!k || !draftItems[idx])return;
  draftItems[idx][k]=e.target.value;
});
$('#itemsEditor').addEventListener('click',e=>{
  if(e.target.dataset.k==='qty'){
    try{e.target.select()}catch{}
  }
});
$('#itemsEditor').addEventListener('change',e=>{
  const row=e.target.closest('.item-editor');
  if(!row)return;
  const idx=Number(row.dataset.idx);
  const k=e.target.dataset.k;
  if(!k || !draftItems[idx])return;
  draftItems[idx][k]=e.target.value;
});
$('#itemsEditor').addEventListener('click',e=>{
  const btn=e.target.closest('[data-remove]');
  if(!btn)return;
  const idx=Number(btn.dataset.remove);
  draftItems.splice(idx,1);
  renderItemsEditor();
});

$('#saveOnlyBtn').onclick=()=>{
  const r=saveDraft();
  if(!r)return;
  closeModal();
};
$('#saveShareBtn').onclick=async()=>{
  const r=saveDraft();
  if(!r)return;
  closeModal();
  await shareRecord(r);
};

document.querySelectorAll('[data-state]').forEach(btn=>btn.onclick=()=>{
  activeFilter=btn.dataset.state;render();
});
$('#showAllBtn').onclick=()=>{activeFilter='all';render()};
$('#shareCurrent').onclick=shareCurrent;

listEl.addEventListener('click',async e=>{
  const btn=e.target.closest('[data-act]');
  if(!btn)return;
  const card=btn.closest('.card');
  const r=records.find(x=>x.id===card?.dataset.id);
  if(!r)return;
  const act=btn.dataset.act;

  if(act==='share'){await shareRecord(r);return}
  if(act==='edit'){openEdit(r);return}
  if(act==='deliver'){
    r.status='delivered';
    r.deliveredAt=nowIso();
    save();
    return;
  }
  if(act==='reopen'){
    r.status='received';
    r.deliveredAt=null;
    save();
    return;
  }
  if(act==='delete'){
    if(!confirm(`¿Eliminar el registro de ${r.client}?`))return;
    records=records.filter(x=>x.id!==r.id);
    save();
  }
});

$('#menuBtn').onclick=()=>menu.classList.toggle('show');
document.addEventListener('click',e=>{
  if(!menu.contains(e.target) && e.target!==$('#menuBtn'))menu.classList.remove('show');
});

$('#exportBtn').onclick=()=>{
  const payload={
    app:'recibidos-3dcd',
    version:1,
    exportedAt:nowIso(),
    records,
    nextNumber:Number(localStorage.getItem(COUNTER_KEY)||1)
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`recibidos-3dcd-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  menu.classList.remove('show');
};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{
  const f=e.target.files?.[0];
  e.target.value='';
  if(!f)return;
  try{
    const x=JSON.parse(await f.text());
    if(x.app!=='recibidos-3dcd' || !Array.isArray(x.records))throw new Error();
    if(!confirm('¿Reemplazar los datos actuales por este respaldo?'))return;
    records=x.records;
    localStorage.setItem(COUNTER_KEY,String(Math.max(Number(x.nextNumber||1),Math.max(0,...records.map(r=>Number(r.numero||0)))+1)));
    save();
  }catch{
    alert('Ese archivo no parece ser un respaldo válido de Recibidos 3DCD.');
  }
  menu.classList.remove('show');
};
$('#clearDeliveredBtn').onclick=()=>{
  const n=records.filter(r=>r.status==='delivered').length;
  if(!n){alert('No hay entregados para eliminar.');return}
  if(!confirm(`¿Eliminar ${n} registro${n===1?'':'s'} entregado${n===1?'':'s'}?`))return;
  records=records.filter(r=>r.status!=='delivered');
  save();
  menu.classList.remove('show');
};

window.addEventListener('beforeunload',save);
load();
</script>
</body>
</html>
