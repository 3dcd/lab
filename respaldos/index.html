<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f5763">
<title>Respaldos</title>
<style>
:root{
  --bg:#a65a68;--card:#fff;--ink:#17181a;--muted:#6d737b;--line:#e0e4e8;
  --shadow:0 12px 30px rgba(39,22,27,.13);--dark:#202a36;--soft:#f5f7f9;
  --gold:#fff1cf;--gold-ink:#7a4b00;--danger:#a52b2b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
html{height:100%} body{min-height:100vh;min-height:100dvh;padding-bottom:max(94px,env(safe-area-inset-bottom))}
button,input{font:inherit} button{cursor:pointer}.hidden{display:none!important}
.app{max-width:760px;margin:0 auto;padding:14px 14px 28px;min-height:100vh;min-height:100dvh}
.top{position:sticky;top:0;z-index:20;margin:-14px -14px 12px;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:rgba(166,90,104,.93);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{margin:0;color:#fff;font-size:25px;line-height:1;font-weight:950;letter-spacing:-.6px}.brand small{display:block;margin-top:5px;color:#f8e9ec;font-size:11px;font-weight:750}
.iconbtn{width:44px;height:44px;border:1px solid rgba(255,255,255,.34);border-radius:16px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:20px;font-weight:950;box-shadow:0 5px 15px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 14px}.stat{background:#fff;border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.4)}.stat b{display:block;font-size:26px;line-height:1;font-weight:950}.stat span{display:block;margin-top:6px;font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.45px;color:var(--muted)}
.toolbar{display:flex;gap:9px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.toolbar::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid rgba(255,255,255,.45);background:#fff;border-radius:999px;padding:10px 14px;font-size:12px;font-weight:950;color:#30343a;box-shadow:0 3px 10px rgba(0,0,0,.06)}.chip.primary{background:var(--gold);border-color:#e0b85e;color:var(--gold-ink)}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:16px 2px 10px;color:#fff}.section-title h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.6px}.section-title small{font-size:11px;font-weight:750;color:#f5dde2}
.folders{display:grid;gap:12px}.folder{background:var(--card);border:1px solid rgba(255,255,255,.55);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}.folderHead{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:13px}.folderIcon{width:62px;height:54px;border-radius:16px;background:#f4d9a4;position:relative;display:grid;place-items:center;font-size:26px}.folderIcon:before{content:"";position:absolute;left:7px;top:-8px;width:26px;height:12px;background:#f4d9a4;border-radius:7px 7px 0 0}.folderText{min-width:0}.folderText h3{margin:0;font-size:18px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.folderText p{margin:6px 0 0;color:var(--muted);font-size:11px;font-weight:700;line-height:1.35}.folderCount{min-width:46px;text-align:center;border-radius:999px;background:#f2e5e8;color:#813b49;padding:7px 9px;font-size:11px;font-weight:950}.folderActions{display:flex;gap:8px;padding:0 13px 13px}.folderBtn{border:1px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-size:12px;font-weight:900}.folderBtn.open{background:var(--dark);border-color:var(--dark);color:#fff;flex:1}.folderBtn.download{background:var(--gold);border-color:#e7c575;color:var(--gold-ink)}
.backups{display:none;border-top:1px solid #eceff2;background:#f7f9fa;padding:10px}.folder.expanded .backups{display:grid;gap:8px}.backup{background:#fff;border:1px solid var(--line);border-radius:17px;padding:11px}.backupTop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.backupName{font-size:12px;font-weight:950;line-height:1.25;word-break:break-word}.backupMeta{margin-top:5px;color:var(--muted);font-size:10px;font-weight:700}.backupActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.smallBtn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;font-size:11px;font-weight:900}.smallBtn.restore{background:#e5f2ed;border-color:#bcd9ce;color:#17624e}.smallBtn.danger{color:var(--danger)}
.empty{background:#fff;border:1px dashed rgba(255,255,255,.65);border-radius:24px;padding:28px 18px;text-align:center;color:var(--muted);box-shadow:var(--shadow);font-size:13px;line-height:1.5}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:5px}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:30;width:64px;height:64px;border-radius:22px;border:0;background:linear-gradient(145deg,#263547,#111827);color:#fff;font-size:34px;line-height:1;font-weight:400;box-shadow:0 16px 35px rgba(17,24,39,.32)}
.menu{position:fixed;z-index:120;top:68px;right:14px;width:230px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 45px rgba(0,0,0,.16);padding:8px;display:none}.menu.show{display:grid;gap:4px}.menu button{border:0;background:#fff;border-radius:14px;text-align:left;padding:12px 11px;font-size:12px;font-weight:850}.menu button:active{background:#f3f5f7}
.note{margin:10px 2px 0;color:#f8e9ec;font-size:10px;line-height:1.45;font-weight:700}
@media(min-width:700px){.fab{right:calc((100vw - 760px)/2 + 18px)}.stats{grid-template-columns:180px 180px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="toprow">
      <div class="brand"><h1>Respaldos</h1><small>Ecosistema local de tus herramientas</small></div>
      <button class="iconbtn" id="menuBtn" aria-label="Menú">⋯</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><b id="appsCount">0</b><span>Aplicaciones</span></div>
    <div class="stat"><b id="backupCount">0</b><span>Respaldos</span></div>
  </div>

  <div class="toolbar">
    <button class="chip primary" id="downloadAllBtn">Descargar todo</button>
    <button class="chip" id="importBtn">Agregar respaldo</button>
  </div>

  <div class="section-title"><h2>Mis carpetas</h2><small id="totalSize">0 MB</small></div>
  <div class="folders" id="folders"></div>
  <div class="note">Para el traspaso directo entre herramientas, todas deben estar abiertas desde el mismo dominio. El ZIP general sigue siendo tu copia física de seguridad.</div>
</div>
<button class="fab" id="addBtn" aria-label="Agregar respaldo">＋</button>
<input id="fileInput" type="file" accept=".zip,.json,.txt,application/zip,application/json,text/plain" hidden>
<div class="menu" id="menu">
  <button id="menuImport">Agregar respaldo</button>
  <button id="menuDownload">Descargar todos en ZIP</button>
  <button id="menuRefresh">Actualizar</button>
  <button id="menuClear">Eliminar todos los respaldos</button>
</div>
<script>
const DB_NAME='3dcd_ecosistema_respaldos_v1',STORE='backups';
const $=s=>document.querySelector(s);let items=[];
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(STORE)){const st=db.createObjectStore(STORE,{keyPath:'id'});st.createIndex('appId','appId',{unique:false});st.createIndex('createdAt','createdAt',{unique:false})}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbAll(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).getAll();r.onsuccess=()=>{const v=r.result||[];db.close();res(v)};r.onerror=()=>{const e=r.error;db.close();rej(e)}})}
async function dbPut(v){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(v);tx.oncomplete=()=>{db.close();res(v)};tx.onerror=()=>{const e=tx.error;db.close();rej(e)}})}
async function dbDelete(id){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{const e=tx.error;db.close();rej(e)}})}
async function dbClear(){const db=await dbOpen();return new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{const e=tx.error;db.close();rej(e)}})}
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fmtDate(v){const d=new Date(v);return Number.isNaN(d)?'—':new Intl.DateTimeFormat('es-AR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}
function fmtSize(n){n=Number(n||0);if(n<1024)return n+' B';if(n<1048576)return (n/1024).toFixed(1)+' KB';return (n/1048576).toFixed(n>10485760?0:1)+' MB'}
function slug(s){return String(s||'aplicacion').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'aplicacion'}
function groups(){const m=new Map();for(const x of items){const k=x.appId||'otros';if(!m.has(k))m.set(k,{appId:k,appName:x.appName||'Otros',appUrl:x.appUrl||'',rows:[]});const g=m.get(k);if(x.appUrl)g.appUrl=x.appUrl;g.rows.push(x)}for(const g of m.values())g.rows.sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));return [...m.values()].sort((a,b)=>a.appName.localeCompare(b.appName,'es'))}
function render(){const gs=groups();$('#appsCount').textContent=gs.length;$('#backupCount').textContent=items.length;$('#totalSize').textContent=fmtSize(items.reduce((a,b)=>a+Number(b.size||b.blob?.size||0),0));const box=$('#folders');if(!gs.length){box.innerHTML='<div class="empty"><b>Todavía no hay respaldos</b>Desde Gestor tocá “Guardar en Respaldos” y aparecerá acá automáticamente. También podés agregar un ZIP con el botón +.</div>';return}box.innerHTML=gs.map(g=>{const sz=g.rows.reduce((a,b)=>a+Number(b.size||b.blob?.size||0),0),last=g.rows[0];return `<section class="folder" data-app="${esc(g.appId)}"><div class="folderHead"><div class="folderIcon">▰</div><div class="folderText"><h3>${esc(g.appName)}</h3><p>Último: ${esc(fmtDate(last.createdAt))} · ${esc(fmtSize(sz))}</p></div><div class="folderCount">${g.rows.length}</div></div><div class="folderActions"><button class="folderBtn open" data-act="toggle">Ver respaldos</button><button class="folderBtn download" data-act="download-app">ZIP carpeta</button></div><div class="backups">${g.rows.map(x=>`<div class="backup" data-id="${esc(x.id)}"><div class="backupTop"><div><div class="backupName">${esc(x.fileName||'respaldo.zip')}</div><div class="backupMeta">${esc(fmtDate(x.createdAt))} · ${esc(fmtSize(x.size||x.blob?.size||0))}</div></div></div><div class="backupActions">${x.appUrl?'<button class="smallBtn restore" data-act="restore">Abrir en '+esc(g.appName)+'</button>':''}<button class="smallBtn" data-act="download">Descargar</button><button class="smallBtn danger" data-act="delete">Eliminar</button></div></div>`).join('')}</div></section>`}).join('')}
async function refresh(){try{items=await dbAll();render()}catch(e){console.error(e);alert('No se pudieron leer los respaldos de este navegador.')}}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500)}
let crcTable=null;function crc32(bytes){if(!crcTable){crcTable=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);crcTable[n]=c>>>0}}let c=0xFFFFFFFF;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}function concat(parts){const len=parts.reduce((a,b)=>a+b.length,0),o=new Uint8Array(len);let p=0;for(const b of parts){o.set(b,p);p+=b.length}return o}
function zipStore(files){const enc=new TextEncoder(),locals=[],centrals=[];let offset=0;for(const f of files){const name=enc.encode(f.name),data=f.data,crc=crc32(data),local=concat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);locals.push(local);centrals.push(concat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]));offset+=local.length}const cd=concat(centrals),end=concat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(offset),u16(0)]);return new Blob([...locals,cd,end],{type:'application/zip'})}
async function zipFor(rows,prefix=''){const fs=[];for(const x of rows){if(!x.blob)continue;fs.push({name:prefix+(x.fileName||'respaldo.zip'),data:new Uint8Array(await x.blob.arrayBuffer())})}if(!fs.length)throw new Error('Sin archivos');return zipStore(fs)}
function stamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`}
async function downloadAll(){if(!items.length)return alert('Todavía no hay respaldos.');const fs=[];for(const g of groups())for(const x of g.rows)if(x.blob)fs.push({name:`${slug(g.appName)}/${x.fileName||'respaldo.zip'}`,data:new Uint8Array(await x.blob.arrayBuffer())});downloadBlob(zipStore(fs),`respaldos-3dcd-${stamp()}.zip`)}
function guessApp(file){const n=file.name.toLowerCase();if(n.includes('gestor')||n.includes('recibidos'))return ['gestor','Gestor'];return ['otros','Otros']}
async function importFile(file){let [appId,appName]=guessApp(file);if(appId==='otros'){const v=prompt('¿De qué aplicación es este respaldo?','Otra aplicación');if(v===null)return;appName=v.trim()||'Otra aplicación';appId=slug(appName)}const blob=file.slice(0,file.size,file.type||'application/octet-stream');await dbPut({id:appId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),appId,appName,appUrl:'',createdAt:new Date().toISOString(),fileName:file.name||'respaldo.zip',mime:file.type||'',size:file.size,blob,formatVersion:1,manual:true});await refresh()}
$('#folders').onclick=async e=>{const act=e.target.closest('[data-act]')?.dataset.act;if(!act)return;const folder=e.target.closest('.folder'),id=e.target.closest('.backup')?.dataset.id,g=groups().find(x=>x.appId===folder?.dataset.app);if(act==='toggle'){folder.classList.toggle('expanded');e.target.textContent=folder.classList.contains('expanded')?'Ocultar':'Ver respaldos';return}if(act==='download-app'&&g){const b=await zipFor(g.rows,slug(g.appName)+'/');downloadBlob(b,`${slug(g.appName)}-respaldos-${stamp()}.zip`);return}const x=items.find(v=>v.id===id);if(!x)return;if(act==='download')downloadBlob(x.blob,x.fileName||'respaldo.zip');if(act==='delete'){if(confirm('¿Eliminar este respaldo?')){await dbDelete(x.id);await refresh()}}if(act==='restore'){if(!x.appUrl)return alert('Este respaldo fue agregado manualmente y no tiene una aplicación vinculada.');const u=new URL(x.appUrl);u.searchParams.set('restoreBackup',x.id);location.href=u.href}};
function chooseFile(){$('#fileInput').click()}$('#addBtn').onclick=chooseFile;$('#importBtn').onclick=chooseFile;$('#menuImport').onclick=()=>{menu.classList.remove('show');chooseFile()};$('#fileInput').onchange=async e=>{const f=e.target.files?.[0];e.target.value='';if(f)try{await importFile(f)}catch(err){console.error(err);alert('No se pudo agregar ese respaldo.')}};
$('#downloadAllBtn').onclick=downloadAll;$('#menuDownload').onclick=()=>{menu.classList.remove('show');downloadAll()};$('#menuRefresh').onclick=()=>{menu.classList.remove('show');refresh()};$('#menuClear').onclick=async()=>{menu.classList.remove('show');if(!items.length)return;if(confirm(`¿Eliminar los ${items.length} respaldos guardados en esta central?`)){await dbClear();await refresh()}};
const menu=$('#menu');$('#menuBtn').onclick=()=>menu.classList.toggle('show');document.addEventListener('click',e=>{if(!menu.contains(e.target)&&e.target!==$('#menuBtn'))menu.classList.remove('show')});window.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});window.addEventListener('pageshow',refresh);refresh();
</script>
</body>
</html>
