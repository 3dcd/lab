<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pong Doble v9</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root{
      --bg:#08111f;
      --panel:#0e1b2f;
      --line:#274261;
      --text:#f4f7fb;
      --muted:#9eb0c6;
      --accent:#7dd3fc;
      --danger:#fb7185;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      width:100%;
      min-height:100%;
      overflow-x:hidden;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      overscroll-behavior:none;
      touch-action:none;
    }
    body{
      min-height:100dvh;
      display:flex;
      flex-direction:column;
      padding:12px;
      padding-bottom:calc(12px + env(safe-area-inset-bottom));
      gap:10px;
    }
    .top{
      display:flex;
      gap:8px;
      align-items:center;
      flex-wrap:wrap;
      background:var(--panel);
      padding:10px;
      border:1px solid var(--line);
      border-radius:16px;
    }
    .title{
      font-weight:800;
      margin-right:auto;
      letter-spacing:.2px;
    }
    .badge{
      font-size:12px;
      color:var(--muted);
    }
    button,input{
      border:1px solid var(--line);
      background:#12243d;
      color:var(--text);
      border-radius:12px;
      padding:10px 12px;
      font-size:15px;
    }
    button{font-weight:700}
    button:active{transform:scale(.98)}
    input{
      width:150px;
      outline:none;
    }
    .status{
      width:100%;
      font-size:13px;
      color:var(--muted);
      min-height:18px;
    }
    .gameWrap{
      flex:1;
      min-height:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    canvas{
      width:min(100%, 900px);
      max-height:72vh;
      aspect-ratio:16/9;
      background:#02070e;
      border:1px solid var(--line);
      border-radius:18px;
      display:block;
      box-shadow:0 10px 40px rgba(0,0,0,.25);
    }
    .controls{
      width:min(100%, 900px);
      align-self:center;
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:16px;
      padding:10px;
      display:grid;
      grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);
      gap:10px;
      align-items:stretch;
      overflow:hidden;
    }
    .controls > *{min-width:0}
    .role{
      font-weight:700;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
    }
    .touch{
      position:relative;
      width:100%;
      min-width:0;
      height:118px;
      border-radius:14px;
      border:1px dashed var(--line);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--muted);
      user-select:none;
      overflow:hidden;
      touch-action:none;
    }
    .touch::before{
      content:"";
      position:absolute;
      top:14px;
      bottom:14px;
      left:50%;
      width:3px;
      border-radius:3px;
      background:#20344a;
      transform:translateX(-50%);
    }
    .touchHandle{
      position:absolute;
      left:50%;
      top:50%;
      width:54px;
      height:18px;
      border-radius:999px;
      background:var(--accent);
      transform:translate(-50%,-50%);
      box-shadow:0 2px 10px rgba(0,0,0,.35);
      pointer-events:none;
    }
    .touchLabel{
      position:absolute;
      left:10px;
      top:10px;
      font-size:11px;
      font-weight:800;
      letter-spacing:.5px;
      color:var(--muted);
      pointer-events:none;
    }
    .touchArrows{
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      font-size:24px;
      line-height:1.15;
      color:var(--muted);
      text-align:center;
      pointer-events:none;
    }
    .touch.active{
      color:var(--text);
      border-style:solid;
      border-color:var(--accent);
    }
    @media (max-width:650px){
      body{padding:8px}
      .top{border-radius:14px}
      .controls{grid-template-columns:1fr}
      input{width:132px}
      canvas{max-height:58vh}
      .touch{height:132px}
    }
  </style>
</head>
<body>
  <div class="top">
    <div class="title">Pong Doble <span style="font-weight:500;color:var(--muted)">v9</span></div>
    <div class="badge" id="peerBadge">sin conexión</div>
    <button id="soloBtn">1 jugador</button>
    <button id="multiBtn">Multijugador</button>
    <button id="hostBtn" style="display:none">Crear sala</button>
    <input id="roomInput" style="display:none" placeholder="Código de sala" autocomplete="off" autocapitalize="off" />
    <button id="shareBtn" style="display:none">Compartir</button>
    <button id="joinBtn" style="display:none">Unirme</button>
    <div class="status" id="status">Abrí este mismo HTML en dos dispositivos. Uno crea la sala y el otro escribe el código.</div>
  </div>

  <div class="gameWrap">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>

  <div class="controls">
    <div>
      <div class="role" id="roleText">Rol: espectador local</div>
      <div class="hint">Mové el dedo hacia arriba y abajo dentro del recuadro. La barrita celeste te muestra la posición de tu paleta.</div>
    </div>
    <div class="touch" id="touchArea">
      <div class="touchLabel">CONTROL</div>
      <div class="touchHandle" id="touchHandle"></div>
      <div class="touchArrows">▲<br>▼</div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const peerBadge = document.getElementById('peerBadge');
  const roleText = document.getElementById('roleText');
  const touchArea = document.getElementById('touchArea');
  const touchHandle = document.getElementById('touchHandle');
  const roomInput = document.getElementById('roomInput');
  const hostBtn = document.getElementById('hostBtn');
  const joinBtn = document.getElementById('joinBtn');
  const soloBtn = document.getElementById('soloBtn');
  const multiBtn = document.getElementById('multiBtn');
  const shareBtn = document.getElementById('shareBtn');

  let peer = null;
  let conn = null;
  let isHost = false;
  let role = null; // left | right
  let connected = false;
  let mode = 'menu'; // menu | solo | multi

  // Rival virtual: deliberadamente imperfecto.
  let aiTargetY = 280;
  let aiNextThinkAt = 0;
  let aiError = 0;
  let aiHesitationUntil = 0;

  const state = {
    leftY: 280,
    rightY: 280,
    ballX: 640,
    ballY: 360,
    ballVX: 7,
    ballVY: 4.5,
    scoreL: 0,
    scoreR: 0,
    rallyHits: 0,
    flash: 0,
    flashColor: null
  };

  const paddle = { w:22, h:150, margin:42, speed:15 };
  const ballR = 15;

  function setStatus(msg){ statusEl.textContent = msg; }

  function makeRoomCode() {
    return 'pong-' + Math.random().toString(36).slice(2, 7);
  }

  function createPeer(id) {
    if (peer) {
      try { peer.destroy(); } catch(e){}
    }

    peer = id
      ? new Peer(id, { debug: 1 })
      : new Peer({ debug: 1 });

    peer.on('open', peerId => {
      peerBadge.textContent = peerId;
      if (isHost) {
        roomInput.value = peerId;
        setStatus('Sala creada. Pasale este código al otro celular.');
      }
    });

    peer.on('connection', incoming => {
      if (!isHost) return;
      if (conn && conn.open) {
        incoming.close();
        return;
      }
      conn = incoming;
      setupConnection();
    });

    peer.on('error', err => {
      console.error(err);
      setStatus('Error de conexión: ' + (err.type || err.message));
    });
  }

  function setupConnection() {
    if (!conn) return;

    conn.on('open', () => {
      connected = true;
      peerBadge.textContent = 'conectado';
      if (isHost) {
        role = 'left';
        roleText.textContent = 'Rol: barra izquierda';
        conn.send({ type:'role', role:'right' });
        conn.send({ type:'state', state });
        setStatus('Conectados. Empieza la partida.');
      } else {
        setStatus('Conectado al anfitrión.');
      }
    });

    conn.on('data', data => {
      if (!data || typeof data !== 'object') return;

      if (data.type === 'role') {
        role = data.role;
        roleText.textContent = role === 'right' ? 'Rol: barra derecha' : 'Rol: barra izquierda';
      }

      if (data.type === 'paddle' && isHost) {
        if (data.role === 'right') state.rightY = clamp(data.y, 0, canvas.height - paddle.h);
      }

      if (data.type === 'state' && !isHost) {
        Object.assign(state, data.state);
      }

      if (data.type === 'restart' && isHost) {
        resetBall(Math.random() > .5 ? 1 : -1);
      }
    });

    conn.on('close', () => {
      connected = false;
      peerBadge.textContent = 'desconectado';
      setStatus('Se cerró la conexión.');
    });
  }


  function showMultiControls(show) {
    hostBtn.style.display = show ? '' : 'none';
    roomInput.style.display = show ? '' : 'none';
    joinBtn.style.display = show ? '' : 'none';
    shareBtn.style.display = 'none';
  }

  function startSolo() {
    mode = 'solo';
    roomInput.readOnly = false;
    showMultiControls(false);
    connected = true;
    isHost = true;
    role = 'left';
    roleText.textContent = 'Rol: barra izquierda · rival automático';
    peerBadge.textContent = '1 jugador';
    setStatus('Modo 1 jugador. El rival reacciona con pequeños errores y puede quedar mal parado.');
    state.scoreL = 0;
    state.scoreR = 0;
    state.leftY = 280;
    state.rightY = 280;
    aiTargetY = 280;
    aiNextThinkAt = 0;
    aiError = 0;
    aiHesitationUntil = 0;
    resetBall(Math.random() > .5 ? 1 : -1);
  }

  soloBtn.addEventListener('click', startSolo);

  multiBtn.addEventListener('click', () => {
    mode = 'multi';
    connected = false;
    isHost = false;
    roomInput.readOnly = false;
    roomInput.value = '';
    showMultiControls(true);
    peerBadge.textContent = 'sin conexión';
    role = null;
    roleText.textContent = 'Rol: elegí crear sala o unirte';
    setStatus('Multijugador: un dispositivo crea la sala y el otro se une con el código.');
  });

  hostBtn.addEventListener('click', () => {
    mode = 'multi';
    isHost = true;
    role = 'left';
    roleText.textContent = 'Rol: barra izquierda';

    const code = makeRoomCode();
    roomInput.value = code;
    roomInput.readOnly = true;
    shareBtn.style.display = '';
    setStatus('Sala creada. Podés seleccionar el código y copiarlo, o tocar Compartir.');
    createPeer(code);
  });


  shareBtn.addEventListener('click', async () => {
    const code = roomInput.value.trim();
    if (!code) return;

    if (navigator.share) {
      try {
        await navigator.share({
          title: 'Pong Doble',
          text: 'Código de sala: ' + code
        });
        setStatus('Código listo para compartir.');
        return;
      } catch (err) {
        // Si el usuario cancela o el sistema falla, caemos al método tradicional.
      }
    }

    roomInput.focus();
    roomInput.select();
    roomInput.setSelectionRange(0, roomInput.value.length);
    setStatus('Código seleccionado. Copialo y envialo al otro jugador.');
  });

  joinBtn.addEventListener('click', () => {
    mode = 'multi';
    roomInput.readOnly = false;
    shareBtn.style.display = 'none';
    const code = roomInput.value.trim();
    if (!code) {
      setStatus('Escribí el código de sala del otro dispositivo.');
      return;
    }

    isHost = false;
    role = 'right';
    roleText.textContent = 'Rol: barra derecha';
    createPeer();

    peer.on('open', () => {
      conn = peer.connect(code, { reliable: true });
      setupConnection();
      setStatus('Intentando conectar...');
    });
  });

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

  function localMove(yNormalized) {
    yNormalized = clamp(yNormalized, 0, 1);
    touchHandle.style.top = (10 + yNormalized * 80) + '%';
    const y = clamp(yNormalized * canvas.height - paddle.h/2, 0, canvas.height - paddle.h);

    if (role === 'left') {
      state.leftY = y;
    } else if (role === 'right') {
      if (isHost) state.rightY = y;
      else {
        state.rightY = y;
        if (conn && conn.open) conn.send({ type:'paddle', role:'right', y });
      }
    }
  }

  let touching = false;

  function pointerMove(ev) {
    const r = touchArea.getBoundingClientRect();
    const norm = clamp((ev.clientY - r.top) / r.height, 0, 1);
    localMove(norm);
  }

  touchArea.addEventListener('pointerdown', ev => {
    touching = true;
    touchArea.classList.add('active');
    touchArea.setPointerCapture(ev.pointerId);
    pointerMove(ev);
  });

  touchArea.addEventListener('pointermove', ev => {
    if (touching) pointerMove(ev);
  });

  function endTouch(ev) {
    touching = false;
    touchArea.classList.remove('active');
    try { touchArea.releasePointerCapture(ev.pointerId); } catch(e){}
  }

  touchArea.addEventListener('pointerup', endTouch);
  touchArea.addEventListener('pointercancel', endTouch);

  function resetBall(dir=1){
    state.ballX = canvas.width/2;
    state.ballY = canvas.height/2;
    state.ballVX = dir * (6.2 + Math.random()*1.2);
    state.ballVY = (Math.random() * 5.6 - 2.8);
    state.rallyHits = 0;
  }

  function hostPhysics() {
    if (mode === 'solo') {
      const now = performance.now();

      // La IA "piensa" a intervalos, no sigue la pelota cuadro por cuadro.
      if (now >= aiNextThinkAt) {
        // A mayor velocidad de pelota, más difícil le resulta predecir.
        const ballSpeed = Math.hypot(state.ballVX, state.ballVY);
        const speedFactor = clamp((ballSpeed - 6) / 13, 0, 1);

        // Error vertical variable. A veces calcula muy bien y otras queda mal parada.
        const baseError = 20 + speedFactor * 65;
        aiError = (Math.random() * 2 - 1) * baseError;

        // En ocasiones duda y tarda más en reaccionar.
        const hesitationChance = 0.10 + speedFactor * 0.12;
        if (Math.random() < hesitationChance) {
          aiHesitationUntil = now + 180 + Math.random() * 280;
        }

        aiTargetY = state.ballY - paddle.h / 2 + aiError;

        // Reacción normal entre 90 y 170 ms; con pelota rápida puede tardar más.
        aiNextThinkAt = now + 90 + Math.random() * (80 + speedFactor * 70);
      }

      if (now >= aiHesitationUntil) {
        const diff = aiTargetY - state.rightY;

        // Tiene una velocidad máxima real: una pelota rápida o angulada puede superarla.
        const ballSpeed = Math.hypot(state.ballVX, state.ballVY);
        const speedFactor = clamp((ballSpeed - 6) / 13, 0, 1);
        const maxStep = 6.0 + speedFactor * 1.6;

        state.rightY += clamp(diff, -maxStep, maxStep);
        state.rightY = clamp(state.rightY, 0, canvas.height - paddle.h);
      }
    }

    state.ballX += state.ballVX;
    state.ballY += state.ballVY;

    // Aceleración continua: empieza suave, pero ya a los pocos segundos se nota.
    const currentSpeed = Math.hypot(state.ballVX, state.ballVY);
    const maxSpeed = 19;
    if (currentSpeed < maxSpeed) {
      const accel = 1.0017;
      state.ballVX *= accel;
      state.ballVY *= accel;
    }

    if (state.ballY - ballR < 0) {
      state.ballY = ballR;
      state.ballVY = Math.abs(state.ballVY);
    }
    if (state.ballY + ballR > canvas.height) {
      state.ballY = canvas.height - ballR;
      state.ballVY = -Math.abs(state.ballVY);
    }

    const leftX = paddle.margin;
    const rightX = canvas.width - paddle.margin - paddle.w;
    const tip = 34; // zona inclinada superior/inferior de la paleta
    const bevelReach = 18; // cuánto sobresale visualmente el bisel

    // LEFT paddle collision with angled tips
    if (
      state.ballVX < 0 &&
      state.ballX - ballR <= leftX + paddle.w + bevelReach &&
      state.ballX > leftX - 8 &&
      state.ballY >= state.leftY - 6 &&
      state.ballY <= state.leftY + paddle.h + 6
    ) {
      const localY = state.ballY - state.leftY;
      let hit = false;

      if (localY >= 0 && localY <= paddle.h) {
        hit = true;
        state.ballX = leftX + paddle.w + ballR;

        if (localY < tip) {
          // Punta superior: rebote marcado hacia arriba
          state.ballVX = Math.abs(state.ballVX) * 1.07;
          state.ballVY = -Math.max(5.5, Math.abs(state.ballVY) + 2.8);
        } else if (localY > paddle.h - tip) {
          // Punta inferior: rebote marcado hacia abajo
          state.ballVX = Math.abs(state.ballVX) * 1.07;
          state.ballVY = Math.max(5.5, Math.abs(state.ballVY) + 2.8);
        } else {
          const offset = (state.ballY - (state.leftY + paddle.h/2)) / (paddle.h/2);
          state.ballVX = Math.abs(state.ballVX) * 1.045;
          state.ballVY += offset * 3.2;
        }
      }

      if (hit) state.rallyHits++;
    }

    // RIGHT paddle collision with mirrored angled tips
    if (
      state.ballVX > 0 &&
      state.ballX + ballR >= rightX - bevelReach &&
      state.ballX < rightX + paddle.w + 8 &&
      state.ballY >= state.rightY - 6 &&
      state.ballY <= state.rightY + paddle.h + 6
    ) {
      const localY = state.ballY - state.rightY;
      let hit = false;

      if (localY >= 0 && localY <= paddle.h) {
        hit = true;
        state.ballX = rightX - ballR;

        if (localY < tip) {
          state.ballVX = -Math.abs(state.ballVX) * 1.07;
          state.ballVY = -Math.max(5.5, Math.abs(state.ballVY) + 2.8);
        } else if (localY > paddle.h - tip) {
          state.ballVX = -Math.abs(state.ballVX) * 1.07;
          state.ballVY = Math.max(5.5, Math.abs(state.ballVY) + 2.8);
        } else {
          const offset = (state.ballY - (state.rightY + paddle.h/2)) / (paddle.h/2);
          state.ballVX = -Math.abs(state.ballVX) * 1.045;
          state.ballVY += offset * 3.2;
        }
      }

      if (hit) state.rallyHits++;
    }

    if (state.ballX < -50) {
      state.scoreR++;
      state.flash = 1;
      state.flashColor = role === 'left' ? 'red' : 'green';
      resetBall(1);
    }

    if (state.ballX > canvas.width + 50) {
      state.scoreL++;
      state.flash = 1;
      state.flashColor = role === 'right' ? 'red' : 'green';
      resetBall(-1);
    }

    if (state.flash > 0) {
      state.flash = Math.max(0, state.flash - 0.045);
    }
  }

  let lastSync = 0;

  function render() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle = '#02070e';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if (state.flash > 0 && state.flashColor) {
      const a = 0.72 * state.flash;
      ctx.fillStyle = state.flashColor === 'red'
        ? `rgba(255,45,65,${a})`
        : `rgba(55,220,110,${a})`;
      ctx.fillRect(0,0,canvas.width,canvas.height);
    }

    ctx.strokeStyle = '#20344a';
    ctx.lineWidth = 4;
    ctx.setLineDash([18,22]);
    ctx.beginPath();
    ctx.moveTo(canvas.width/2, 20);
    ctx.lineTo(canvas.width/2, canvas.height-20);
    ctx.stroke();
    ctx.setLineDash([]);

    function drawBeveledPaddle(x, y, side) {
      const w = paddle.w;
      const h = paddle.h;
      const bevel = 18;
      ctx.fillStyle = '#f4f7fb';
      ctx.beginPath();

      if (side === 'left') {
        ctx.moveTo(x, y + bevel);
        ctx.lineTo(x + w, y);
        ctx.lineTo(x + w, y + h);
        ctx.lineTo(x, y + h - bevel);
      } else {
        ctx.moveTo(x, y);
        ctx.lineTo(x + w, y + bevel);
        ctx.lineTo(x + w, y + h - bevel);
        ctx.lineTo(x, y + h);
      }

      ctx.closePath();
      ctx.fill();
    }

    drawBeveledPaddle(paddle.margin, state.leftY, 'left');
    drawBeveledPaddle(canvas.width - paddle.margin - paddle.w, state.rightY, 'right');

    ctx.beginPath();
    ctx.arc(state.ballX, state.ballY, ballR, 0, Math.PI*2);
    ctx.fill();

    ctx.font = '700 76px system-ui';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#6f839a';
    ctx.fillText(state.scoreL, canvas.width/2 - 90, 95);
    ctx.fillText(state.scoreR, canvas.width/2 + 90, 95);

    if (state.rallyHits >= 6) {
      ctx.font = '700 22px system-ui';
      ctx.fillStyle = '#7dd3fc';
      ctx.fillText('RALLY ' + state.rallyHits, canvas.width/2, 145);
    }

    ctx.font = '600 24px system-ui';
    ctx.fillStyle = '#8396ab';
    const footerText = mode === 'solo'
      ? '1 JUGADOR'
      : (connected ? 'DOS DISPOSITIVOS CONECTADOS' : 'MODO DE CONEXIÓN');
    ctx.fillText(footerText, canvas.width/2, canvas.height-34);
  }

  function loop(t) {
    if (isHost && connected) {
      hostPhysics();

      if (conn && conn.open && t - lastSync > 33) {
        conn.send({ type:'state', state });
        lastSync = t;
      }
    }

    render();
    requestAnimationFrame(loop);
  }

  showMultiControls(false);
  peerBadge.textContent = 'elegí modo';
  setStatus('Elegí 1 jugador o Multijugador.');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
