<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#f6f7f9">
  <title>3DCD LAB · Visor 3D · Base limpia</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root{
      --bg:#f6f7f9;
      --card:rgba(255,255,255,.92);
      --text:#101114;
      --muted:#737b88;
      --line:#e4e8ee;
      --purple:#7d5cff;
      --shadow:0 18px 45px rgba(20,25,35,.10);
      --soft-shadow:0 10px 25px rgba(20,25,35,.07);
      --radius:26px;
      --header-h:66px;
      --side-w:360px;
      --bottom-h:190px;
      --split:12px;
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;overscroll-behavior:none}
    body{
      margin:0;
      overflow:hidden;
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:radial-gradient(circle at top center,#fff 0,#f7f8fa 38%,#eef1f5 100%);
      -webkit-tap-highlight-color:transparent;
    }

    button{
      font:inherit;appearance:none;-webkit-appearance:none;
      color:inherit;-webkit-text-fill-color:currentColor;
      -webkit-tap-highlight-color:transparent;
    }
    header{
      height:var(--header-h);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.78);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      position:relative;
      z-index:20;
    }
    .brand{font-size:20px;font-weight:950;letter-spacing:.03em;white-space:nowrap}
    .brand span{
      color:var(--purple);font-size:12px;font-weight:900;letter-spacing:.08em;
      text-transform:uppercase;border-left:1px solid #cfd4dc;padding-left:12px;margin-left:12px;
    }
    .header-actions{display:flex;align-items:center;gap:8px;min-width:0}
    .pill{
      border:1px solid var(--line);background:#fff;color:#20232a;border-radius:999px;
      padding:10px 14px;box-shadow:var(--soft-shadow);font-weight:850;font-size:13px;
      cursor:pointer;touch-action:manipulation;white-space:nowrap;
      color:#20232a;-webkit-text-fill-color:#20232a;
    }
    .pill[aria-pressed="true"]{background:#111;color:#fff;-webkit-text-fill-color:#fff;border-color:#111}
    .pill:focus,.pill:active,.side-tab:focus,.side-tab:active,.bottom-tab:focus,.bottom-tab:active{color:inherit}

    main{
      height:calc(100dvh - var(--header-h));
      padding:14px 18px max(14px,env(safe-area-inset-bottom));
      overflow:hidden;
    }
    .workspace{
      height:100%;min-height:0;min-width:0;
      display:grid;
      grid-template-columns:minmax(0,1fr) var(--split) var(--side-w);
      grid-template-rows:minmax(0,1fr) var(--split) var(--bottom-h);
      grid-template-areas:
        "stage  vbar side"
        "hbar   vbar side"
        "bottom vbar side";
    }

    .card{
      min-width:0;min-height:0;
      background:var(--card);border:1px solid rgba(255,255,255,.96);
      border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;
    }
    .stage{grid-area:stage;position:relative;display:grid;place-items:center}
    .side{grid-area:side;padding:22px;overflow:auto;-webkit-overflow-scrolling:touch}
    .bottom{grid-area:bottom;padding:18px 22px;overflow:auto;-webkit-overflow-scrolling:touch}

    /* El contenido conserva el desplazamiento, pero sin la barra nativa que se
       superpone a las esquinas redondeadas de macOS, iPadOS o Android. */
    .side,.bottom{scrollbar-width:none;-ms-overflow-style:none}
    .side::-webkit-scrollbar,.bottom::-webkit-scrollbar{width:0;height:0;display:none}

    .placeholder{text-align:center;padding:28px;max-width:560px;pointer-events:none;user-select:none}
    .placeholder-icon{
      width:82px;height:82px;border-radius:24px;background:#f0f1f3;display:grid;place-items:center;
      margin:0 auto 18px;box-shadow:var(--soft-shadow);font-size:30px;font-weight:950;
    }
    .placeholder h1,.placeholder h2{margin:0 0 9px;font-weight:950;letter-spacing:-.03em}
    .placeholder h1{font-size:clamp(28px,4vw,54px)}
    .placeholder h2{font-size:22px}
    .placeholder p{margin:0;color:var(--muted);line-height:1.5;font-weight:650}

    .section-title{margin:0 0 14px;font-size:17px;font-weight:950}
    .fake-control{height:42px;border-radius:13px;background:#f2f3f5;border:1px solid #eceef2;margin-bottom:10px}
    .fake-control.dark{background:#17181b;border-color:#17181b}
    .bottom-inner{display:flex;align-items:center;justify-content:center;height:100%;min-height:90px}

    .splitter{
      position:relative;z-index:12;touch-action:none;user-select:none;-webkit-user-select:none;
      cursor:col-resize;
    }
    .splitter-v{grid-area:vbar}
    .splitter-h{grid-area:hbar;cursor:row-resize}

    /* Área invisible ampliada: la guía sigue siendo fina, pero el dedo puede
       iniciar el arrastre bastante antes de acertar exactamente en el centro. */
    .splitter::before{
      content:"";position:absolute;z-index:0;background:transparent;
    }
    .splitter-v::before{
      width:40px;height:100%;left:50%;top:0;transform:translateX(-50%);
    }
    .splitter-h::before{
      width:100%;height:40px;left:0;top:50%;transform:translateY(-50%);
    }
    @media (pointer:coarse){
      .splitter-v::before{width:52px}
      .splitter-h::before{height:52px}
    }

    /* El separador mantiene toda su zona táctil, pero sin una línea continua visible. */
    .splitter::after{
      content:"";position:absolute;border-radius:999px;background:#cbd0d8;
      box-shadow:0 0 0 4px rgba(246,247,249,.92);
      transition:background .15s ease,transform .15s ease;
    }
    .splitter-v::after{width:3px;height:54px;left:50%;top:50%;transform:translate(-50%,-50%)}
    .splitter-h::after{height:3px;width:54px;left:50%;top:50%;transform:translate(-50%,-50%)}
    .splitter:is(:hover,.dragging)::after{background:#17181b}
    .splitter-v.dragging::after{transform:translate(-50%,-50%) scaleY(1.15)}
    .splitter-h.dragging::after{transform:translate(-50%,-50%) scaleX(1.15)}

    .side-tab,.bottom-tab{
      display:none;position:fixed;z-index:25;border:1px solid var(--line);background:#fff;
      box-shadow:var(--soft-shadow);font-weight:900;cursor:pointer;touch-action:manipulation;
      color:#20232a;-webkit-text-fill-color:#20232a;
    }
    .side-tab{right:0;top:50%;transform:translateY(-50%);border-radius:16px 0 0 16px;padding:16px 10px;writing-mode:vertical-rl}
    .bottom-tab{left:50%;bottom:max(0px,env(safe-area-inset-bottom));transform:translateX(-50%);border-radius:16px 16px 0 0;padding:10px 18px}

    body.side-hidden .workspace{
      grid-template-columns:minmax(0,1fr) 0 0;
      grid-template-areas:"stage stage stage" "hbar hbar hbar" "bottom bottom bottom";
    }
    body.side-hidden .side,body.side-hidden .splitter-v{display:none}
    body.side-hidden .side-tab{display:block}

    body.bottom-hidden .workspace{
      grid-template-rows:minmax(0,1fr) 0 0;
      grid-template-areas:"stage vbar side" "stage vbar side" "stage vbar side";
    }
    body.bottom-hidden .bottom,body.bottom-hidden .splitter-h{display:none}
    body.bottom-hidden .bottom-tab{display:block}

    body.side-hidden.bottom-hidden .workspace{
      grid-template-columns:1fr;grid-template-rows:1fr;grid-template-areas:"stage";
    }

    body.is-dragging,body.is-dragging *{cursor:inherit!important}
    body.is-dragging iframe,body.is-dragging canvas{pointer-events:none!important}

    @media (max-width:1100px){
      :root{--side-w:320px;--bottom-h:165px}
      main{padding:10px 12px max(10px,env(safe-area-inset-bottom))}
      .workspace{grid-template-columns:minmax(0,1fr) var(--split) minmax(260px,var(--side-w))}
      .side{padding:17px}.bottom{padding:14px 17px}
      .card{border-radius:22px}
    }

    @media (max-width:760px){
      :root{--header-h:58px;--bottom-h:150px}
      header{padding-left:12px;padding-right:12px}
      .brand{font-size:17px}.brand span{display:none}
      .pill{padding:9px 11px;font-size:12px}
      .workspace{
        grid-template-columns:1fr;
        grid-template-rows:minmax(0,1fr) var(--split) var(--bottom-h);
        grid-template-areas:"stage" "hbar" "bottom";
      }
      .splitter-v{display:none}
      .side{
        display:block;position:fixed;z-index:30;right:10px;top:calc(var(--header-h) + 10px);
        bottom:10px;width:min(88vw,350px);transform:translateX(calc(100% + 24px));
        transition:transform .22s ease;
      }
      body.mobile-side-open .side{transform:translateX(0)}
      body.mobile-side-open .side{
        background:rgba(255,255,255,.78);
        -webkit-backdrop-filter:blur(18px) saturate(1.08);
        backdrop-filter:blur(18px) saturate(1.08);
        border-color:rgba(255,255,255,.72);
        box-shadow:0 20px 55px rgba(20,25,35,.16);
      }
      body.side-hidden .side{display:none}
      body.side-hidden .workspace{grid-template-columns:1fr;grid-template-areas:"stage" "hbar" "bottom"}
      body.bottom-hidden .workspace{grid-template-rows:1fr;grid-template-areas:"stage"}
      .placeholder{padding:20px}.placeholder-icon{width:68px;height:68px;border-radius:20px}
    }

    /* Primer módulo incorporado al template: únicamente el visor 3D. */
    .viewer-stage{
      display:block;
      background:radial-gradient(circle at center,#fff 0,#fbfcfd 52%,#f0f2f5 100%);
      isolation:isolate;
    }
    .viewer-stage model-viewer{
      display:block;width:100%;height:100%;min-width:0;min-height:0;
      background:transparent;--poster-color:transparent;touch-action:none;
      -webkit-user-select:none;user-select:none;
      filter:brightness(var(--viewer-brightness,1)) contrast(var(--viewer-contrast,1)) saturate(var(--viewer-saturation,1));
    }
    .viewer-label{
      position:absolute;left:50%;top:20px;transform:translateX(-50%);z-index:2;
      display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;
      pointer-events:none;color:#15171b;text-shadow:0 1px 10px rgba(255,255,255,.95);
    }
    .viewer-label strong{font-size:clamp(24px,3.3vw,46px);font-weight:950;letter-spacing:.025em;line-height:.95}
    .viewer-label span{font-size:clamp(11px,1.2vw,14px);font-weight:750;color:#727985;white-space:nowrap}
    .model-loading,.model-error{
      position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;
      color:var(--muted);font-weight:850;background:radial-gradient(circle at center,#fff,#f0f2f5);
    }
    .model-error{color:#8f3131}
    .empty-panel{
      min-height:130px;border:1px dashed #d9dde4;border-radius:18px;padding:18px;
      display:flex;flex-direction:column;justify-content:center;gap:7px;color:var(--muted);line-height:1.45;
    }
    .empty-panel strong{color:var(--text);font-size:15px}
    @media (max-width:760px){
      .viewer-label{top:15px}.viewer-label span{white-space:normal;max-width:75vw}
    }

    /* Ajustes básicos del visor: módulo aislado dentro del panel lateral. */
    .settings-stack{display:grid;gap:14px}
    .model-file{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:13px 14px;border:1px solid #e7e9ee;border-radius:15px;background:#f7f8fa;
      font-size:13px;font-weight:850;color:#343941;
    }
    .model-file small{color:#7b828d;font-weight:750;white-space:nowrap}
    .settings-button{
      width:100%;min-height:44px;border:1px solid #17181b;border-radius:14px;
      background:#17181b;color:#fff;-webkit-text-fill-color:#fff;font-weight:900;
      cursor:pointer;touch-action:manipulation;padding:11px 14px;
    }
    .settings-button:active{transform:translateY(1px)}
    .control-group{padding:14px;border:1px solid #e8eaf0;border-radius:16px;background:rgba(248,249,251,.92)}
    .control-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
    .control-head label{font-size:13px;font-weight:900;color:#25282e}
    .control-value{min-width:48px;text-align:right;color:#747b86;font-size:12px;font-weight:850;font-variant-numeric:tabular-nums}
    .control-group input[type="range"]{
      display:block;
      width:100%;
      height:44px;
      margin:-10px 0;
      padding:10px 0;
      border:0;
      border-radius:999px;
      background:transparent;
      appearance:none;
      -webkit-appearance:none;
      cursor:pointer;
      touch-action:pan-y;
      -webkit-tap-highlight-color:transparent;
    }
    .control-group input[type="range"]:focus{outline:none}
    .control-group input[type="range"]::-webkit-slider-runnable-track{
      width:100%;height:4px;border-radius:999px;background:#d9dde4;
    }
    .control-group input[type="range"]::-webkit-slider-thumb{
      appearance:none;-webkit-appearance:none;
      width:20px;height:26px;margin-top:-11px;
      border:2px solid #17181b;border-radius:999px;
      background:#fff;
      box-shadow:0 3px 10px rgba(20,24,32,.22);
    }
    .control-group input[type="range"]::-moz-range-track{
      width:100%;height:4px;border:0;border-radius:999px;background:#d9dde4;
    }
    .control-group input[type="range"]::-moz-range-progress{
      height:4px;border-radius:999px;background:#17181b;
    }
    .control-group input[type="range"]::-moz-range-thumb{
      width:20px;height:26px;
      border:2px solid #17181b;border-radius:999px;
      background:#fff;
      box-shadow:0 3px 10px rgba(20,24,32,.22);
    }
    @media (pointer:coarse){
      .control-group input[type="range"]{
        height:54px;
        margin:-15px 0;
        padding:15px 0;
      }
      .control-group input[type="range"]::-webkit-slider-thumb{
        width:22px;height:28px;margin-top:-12px;
      }
      .control-group input[type="range"]::-moz-range-thumb{
        width:22px;height:28px;
      }
    }
    .control-note{margin:8px 0 0;color:#8a909a;font-size:11px;line-height:1.4;font-weight:650}


    .timeline-panel{
      background:#f6f7f9;
      border:1px solid #e7e9ee;
      border-radius:18px;
      padding:13px;
      margin-top:12px;
    }

    .motion-dock{
      flex:0 0 auto;
      border-top:1px solid #e7e9ee;
      background:rgba(255,255,255,.97);
      padding:8px 12px 12px;
      box-shadow:0 -10px 30px rgba(20,25,35,.06);
    }

    .motion-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:6px;
    }

    .motion-title{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:220px;
    }

    .motion-title strong{
      font-size:14px;
      font-weight:950;
      letter-spacing:.02em;
    }

    .motion-title span,
    .motion-hint{
      color:#6f7785;
      font-size:12px;
      line-height:1.35;
      font-weight:650;
    }

    .motion-controls{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:6px;
      flex-wrap:wrap;
    }

    .motion-btn{
      border:1px solid #dfe3eb;
      background:#fff;
      color:#111;
      border-radius:12px;
      min-height:34px;
      padding:0 11px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 6px 16px rgba(20,25,35,.06);
    }

    .motion-btn.primary{
      background:#111;
      border-color:#111;
      color:#fff;
    }

    .motion-btn:hover{transform:translateY(-1px)}

    .motion-timebox{
      display:flex;
      align-items:center;
      gap:6px;
      border:1px solid #dfe3eb;
      background:#fff;
      border-radius:12px;
      min-height:34px;
      padding:0 9px;
      color:#6f7785;
      font-size:12px;
      font-weight:850;
    }

    .motion-timebox input{
      width:58px;
      border:0;
      outline:0;
      background:transparent;
      color:#111;
      text-align:center;
      font-size:14px;
      font-weight:950;
    }

    .timeline-row{
      display:grid;
      grid-template-columns:76px minmax(0,1fr) 66px;
      align-items:center;
      gap:10px;
    }

    .timeline-clock{
      color:#343943;
      font-variant-numeric:tabular-nums;
      font-size:12px;
      font-weight:950;
      text-align:center;
      background:#f6f7f9;
      border:1px solid #e6e9ef;
      border-radius:12px;
      padding:8px 6px;
    }

    .mini-timeline{
      --track-pad:14px;
      position:relative;
      height:62px;
      border-radius:15px;
      background:linear-gradient(180deg,#fff 0,#f6f7f9 100%);
      border:1px solid #dfe3eb;
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      touch-action:none;
    }

    .mini-timeline::before{
      content:'';
      position:absolute;
      left:var(--track-pad);
      right:var(--track-pad);
      top:36px;
      height:4px;
      border-radius:999px;
      background:#d9dee7;
      box-shadow:inset 0 1px 2px rgba(0,0,0,.05);
    }

    .timeline-scale{
      position:absolute;
      inset:0 var(--track-pad) auto var(--track-pad);
      top:8px;
      height:18px;
      pointer-events:none;
    }

    .tick{
      position:absolute;
      top:0;
      width:1px;
      height:9px;
      background:#bfc6d2;
      transform:translateX(-.5px);
    }

    .tick.major{height:13px;background:#8d96a6}

    .tick-label{
      position:absolute;
      top:16px;
      transform:translateX(-50%);
      color:#818a99;
      font-size:10px;
      font-weight:800;
      font-variant-numeric:tabular-nums;
    }

    .playhead{
      position:absolute;
      top:4px;
      bottom:4px;
      width:2px;
      left:0%;
      background:#111;
      opacity:.95;
      pointer-events:auto;
      cursor:ew-resize;
      transform:translateX(-1px);
      z-index:3;
    }

    .playhead::before{
      content:'';
      position:absolute;
      top:-1px;
      left:50%;
      width:12px;
      height:12px;
      background:#111;
      border-radius:50%;
      transform:translateX(-50%);
      box-shadow:0 4px 12px rgba(0,0,0,.22);
    }

    .kf-dot{
      position:absolute;
      top:36px;
      width:18px;
      height:18px;
      border-radius:6px;
      background:#111;
      border:3px solid #fff;
      box-shadow:0 5px 12px rgba(0,0,0,.22);
      transform:translate(-50%,-50%) rotate(45deg);
      z-index:4;
      cursor:grab;
      touch-action:none;
    }

    .kf-dot:active{cursor:grabbing}

    .kf-dot.removing{
      background:#d33;
      opacity:.55;
      transform:translate(-50%,-50%) rotate(45deg) scale(.86);
    }

    .kf-dot.active{
      background:var(--purple);
      width:21px;
      height:21px;
    }

    .kf-dot::after{
      content:attr(data-label);
      position:absolute;
      left:50%;
      top:24px;
      transform:translateX(-50%) rotate(-45deg);
      color:#343943;
      font-size:10px;
      font-weight:900;
      white-space:nowrap;
    }

    .keyframe-list{
      display:none;
      flex-wrap:wrap;
      gap:7px;
      margin-top:8px;
    }

    .keyframe-chip{
      border:1px solid #dde2ea;
      background:#fff;
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      font-weight:850;
      color:#343943;
      cursor:pointer;
      box-shadow:0 5px 14px rgba(20,25,35,.05);
    }

    .keyframe-chip.active{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .keyframe-empty{
      width:100%;
      color:#7c8490;
      font-size:12px;
      line-height:1.35;
      font-weight:650;
    }


    .step-arrows{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      margin:6px 0 8px;
      pointer-events:auto;
    }

    .step-arrow{
      width:58px;
      height:42px;
      border:1px solid rgba(17,17,17,.12);
      border-radius:999px;
      background:#fff;
      color:#111;
      box-shadow:0 10px 24px rgba(20,25,35,.10);
      cursor:pointer;
      display:grid;
      place-items:center;
      transition:transform .18s ease, background .18s ease;
    }

    .step-arrow::before{
      content:'';
      width:0;
      height:0;
      border-top:11px solid transparent;
      border-bottom:11px solid transparent;
    }

    .step-arrow.prev::before{border-right:17px solid currentColor;margin-left:-3px}
    .step-arrow.next::before{border-left:17px solid currentColor;margin-right:-3px}

    .step-arrow:hover:not(:disabled){
      transform:translateY(-1px) scale(1.03);
      background:#f8f9fb;
    }

    .step-arrow:disabled{
      opacity:.45;
      cursor:not-allowed;
      transform:none;
    }

    .motion-btn.locked{
      background:#111;
      border-color:#111;
      color:#fff;
    }

    .mini-timeline.timeline-locked{
      opacity:.64;
      cursor:not-allowed;
    }

    .mini-timeline.timeline-locked .kf-dot,
    .mini-timeline.timeline-locked .playhead{
      pointer-events:none;
    }

    .motion-btn.is-hidden{
      display:none;
    }

    .motion-title strong .mode-badge{
      display:inline-block;
      margin-left:8px;
      padding:3px 7px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:10px;
      letter-spacing:.07em;
      vertical-align:middle;
    }

    .bubble-layer{
      position:absolute;
      inset:0;
      z-index:5;
      pointer-events:none;
    }

    .info-bubble{
      position:absolute;
      min-width:160px;
      max-width:min(320px, 42vw);
      min-height:44px;
      padding:12px 14px;
      border:0;
      background:#fff;
      backdrop-filter:none;
      border-radius:18px;
      color:#111;
      font-size:14px;
      font-weight:760;
      line-height:1.32;
      box-shadow:0 12px 28px rgba(20,25,35,.10);
      pointer-events:auto;
      cursor:grab;
      user-select:none;
      -webkit-user-select:none;
      touch-action:none;
      outline:none;
      opacity:1;
      --bubble-anchor-transform:translate(-50%, -50%);
      transform:var(--bubble-anchor-transform) translateY(0) scale(1);
      transition:box-shadow .14s ease;
      will-change:transform, opacity;
    }

    .info-bubble.bubble-enter{
      animation:bubbleEnter .56s cubic-bezier(.2,.9,.2,1) both;
    }

    .bubble-layer.bubble-hiding .info-bubble{
      animation:bubbleExit .30s cubic-bezier(.5,0,.25,1) both;
    }

    @keyframes bubbleEnter{
      from{opacity:0; transform:var(--bubble-anchor-transform) translateY(8px) scale(.965)}
      to{opacity:1; transform:var(--bubble-anchor-transform) translateY(0) scale(1)}
    }

    @keyframes bubbleExit{
      from{opacity:1; transform:var(--bubble-anchor-transform) translateY(0) scale(1)}
      to{opacity:0; transform:var(--bubble-anchor-transform) translateY(-8px) scale(.96)}
    }

    .info-bubble:active{cursor:grabbing}

    .info-bubble.selected{
      box-shadow:0 0 0 4px rgba(17,17,17,.08), 0 12px 28px rgba(20,25,35,.12);
    }

    .info-bubble[contenteditable="true"]{
      cursor:text;
      user-select:text;
      background:#fff;
      box-shadow:0 0 0 4px rgba(125,92,255,.14), 0 12px 28px rgba(20,25,35,.10);
    }

    .info-bubble::after{
      content:'';
      position:absolute;
      width:0;
      height:0;
      background:transparent;
    }

    .info-bubble.pointer-bottom{--bubble-anchor-transform:translate(-50%, calc(-100% - 11px));}
    .info-bubble.pointer-top{--bubble-anchor-transform:translate(-50%, 11px);}
    .info-bubble.pointer-left{--bubble-anchor-transform:translate(11px, -50%);}
    .info-bubble.pointer-right{--bubble-anchor-transform:translate(calc(-100% - 11px), -50%);}
    .info-bubble.pointer-none{--bubble-anchor-transform:translate(-50%, -50%);}

    .info-bubble.pointer-bottom::after{
      left:50%;
      bottom:-11px;
      transform:translateX(-50%);
      border-left:11px solid transparent;
      border-right:11px solid transparent;
      border-top:11px solid #fff;
      filter:none;
    }
    .info-bubble.pointer-top::after{
      left:50%;
      top:-11px;
      transform:translateX(-50%);
      border-left:11px solid transparent;
      border-right:11px solid transparent;
      border-bottom:11px solid #fff;
      filter:none;
    }
    .info-bubble.pointer-left::after{
      left:-11px;
      top:50%;
      transform:translateY(-50%);
      border-top:11px solid transparent;
      border-bottom:11px solid transparent;
      border-right:11px solid #fff;
      filter:none;
    }
    .info-bubble.pointer-right::after{
      right:-11px;
      top:50%;
      transform:translateY(-50%);
      border-top:11px solid transparent;
      border-bottom:11px solid transparent;
      border-left:11px solid #fff;
      filter:none;
    }
    .info-bubble.pointer-none::after{display:none}

    .viewer-stage.viewer-locked .info-bubble{
      pointer-events:auto;
    }


    @media(max-width:760px){
      body.mobile-side-open::before{content:"";position:fixed;inset:var(--header-h) 0 0;z-index:27;background:rgba(255,255,255,.05);backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);pointer-events:none}
      body.mobile-side-open .side{background:rgba(255,255,255,.38)!important;border-color:rgba(255,255,255,.45)!important;backdrop-filter:blur(12px) saturate(1.05)!important;-webkit-backdrop-filter:blur(12px) saturate(1.05)!important;box-shadow:0 20px 55px rgba(20,25,35,.12)!important}
      body.mobile-side-open .model-file,body.mobile-side-open .control-group,body.mobile-side-open .settings-button{background:rgba(255,255,255,.48)}
      .keyframe-ui{gap:5px}.keyframe-head{align-items:flex-start}.keyframe-title{min-width:112px}.keyframe-title strong{font-size:11px}.keyframe-title span{font-size:9px}.keyframe-actions{overflow-x:auto;flex-wrap:nowrap;justify-content:flex-start;max-width:none;width:100%;padding-bottom:2px}.kf-btn,.kf-duration{flex:0 0 auto;min-height:29px}.kf-btn{padding:0 8px;font-size:9px}.kf-step-row{height:29px;gap:8px}.kf-arrow{width:42px;height:28px}.kf-timeline-row{grid-template-columns:38px minmax(0,1fr) 38px;gap:5px}.kf-clock{font-size:8px;padding:6px 3px}.kf-track{height:34px}.kf-track::before,.kf-dot{top:20px}.kf-scale{top:3px}.kf-tick-label{display:none}.kf-playhead{top:2px;bottom:2px}
    }

    @media(max-width:760px){
      .motion-head{display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:5px!important}
      .motion-title{width:100%!important;min-width:0!important}
      .motion-controls{width:100%!important;max-width:none!important;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;justify-content:flex-start!important;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;padding:1px 0 4px!important}
      .motion-btn,.motion-timebox{flex:0 0 auto!important}
    }

    /* Línea compacta: sin tarjeta interior ni textos auxiliares */
    .bottom{padding:6px 8px;overflow:hidden}
    .motion-dock{width:100%;height:100%;background:transparent;border:0;box-shadow:none;padding:0;display:flex;flex-direction:column;justify-content:center;min-width:0}
    .motion-head{display:block;margin:0 0 5px;min-width:0}
    .motion-controls{display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:6px;width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;scrollbar-width:none;padding:2px 1px 5px;touch-action:pan-x}
    .motion-controls::-webkit-scrollbar{display:none}
    .motion-btn,.motion-timebox{flex:0 0 auto;white-space:nowrap}
    .timeline-panel{background:transparent;border:0;box-shadow:none}
    .control-note{display:none!important}
    @media(max-width:760px){
      .bottom{padding:4px 5px;background:rgba(255,255,255,.16);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
      .motion-controls{gap:5px;padding-bottom:4px}
      .motion-btn,.motion-timebox{min-height:29px!important;font-size:10px!important;border-radius:10px!important}
    }

  </style>
</head>
<body>
  <header>
    <div class="brand">3DCD LAB <span>Visor 3D</span></div>
    <div class="header-actions">
      <button class="pill" id="bottomToggle" type="button" aria-pressed="true">Línea</button>
      <button class="pill" id="sideToggle" type="button" aria-pressed="true">Ajustes</button>
    </div>
  </header>

  <main>
    <div class="workspace" id="workspace">
      <section class="card stage viewer-stage" id="stage">
        <model-viewer
          id="viewer"
          src="./demo.glb"
          alt="Modelo 3D de demostración"
          camera-controls
          touch-action="none"
          interaction-prompt="none"
          shadow-intensity="1"
          shadow-softness="0.65"
          exposure="1"
          environment-image="neutral"
          camera-orbit="0deg 75deg 105%"
          field-of-view="30deg">
          <div class="model-loading" slot="poster">Cargando modelo 3D…</div>
          <div class="model-error" slot="error">No se pudo cargar el modelo 3D.</div>
        </model-viewer>
        <div class="bubble-layer" id="bubbleLayer"></div>
        <div class="viewer-label" aria-hidden="true">
          <strong>VISOR 3D</strong>
          <span>Arrastrá para girar · pellizcá para acercar</span>
        </div>
      </section>

      <div class="splitter splitter-v" id="splitterV" role="separator" aria-orientation="vertical" aria-label="Cambiar ancho del panel"></div>

      <aside class="card side" id="sidePanel">
        <h2 class="section-title">Ajustes</h2>
        <div class="settings-stack">
          <div class="model-file"><span>demo.glb</span><small>Modelo activo</small></div>
          <button class="settings-button" id="resetCamera" type="button">Restablecer cámara</button>

          <div class="control-group">
            <div class="control-head"><label for="modelSize">Tamaño del modelo</label><output class="control-value" id="modelSizeValue">100%</output></div>
            <input id="modelSize" type="range" min="65" max="145" step="1" value="100">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="exposure">Iluminación</label><output class="control-value" id="exposureValue">1.00</output></div>
            <input id="exposure" type="range" min="0.45" max="1.80" step="0.05" value="1">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="shadow">Sombra</label><output class="control-value" id="shadowValue">1.00</output></div>
            <input id="shadow" type="range" min="0" max="2" step="0.05" value="1">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="shadowSoftness">Suavidad de sombra</label><output class="control-value" id="shadowSoftnessValue">0.65</output></div>
            <input id="shadowSoftness" type="range" min="0" max="1" step="0.05" value="0.65">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="brightness">Brillo visual</label><output class="control-value" id="brightnessValue">1.00</output></div>
            <input id="brightness" type="range" min="0.55" max="1.55" step="0.05" value="1">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="contrast">Contraste</label><output class="control-value" id="contrastValue">1.00</output></div>
            <input id="contrast" type="range" min="0.60" max="1.60" step="0.05" value="1">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="saturation">Saturación visual</label><output class="control-value" id="saturationValue">1.00</output></div>
            <input id="saturation" type="range" min="0" max="2" step="0.05" value="1">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="metalExtra">Metal extra</label><output class="control-value" id="metalExtraValue">0.00</output></div>
            <input id="metalExtra" type="range" min="0" max="1" step="0.05" value="0">
          </div>

          <div class="control-group">
            <div class="control-head"><label for="polishExtra">Pulido extra</label><output class="control-value" id="polishExtraValue">0.00</output></div>
            <input id="polishExtra" type="range" min="0" max="1" step="0.05" value="0">
          </div>
        </div>
      </aside>

      <div class="splitter splitter-h" id="splitterH" role="separator" aria-orientation="horizontal" aria-label="Cambiar altura del panel inferior"></div>

      <section class="card bottom" id="bottomPanel">
        <div class="motion-dock" id="motionDock">
          <div class="motion-head">
            <span id="animState" hidden></span>
            <div class="motion-controls">
              <button class="motion-btn primary is-hidden" id="playAnim">▶ Play</button>
              <button class="motion-btn is-hidden" id="pauseAnim">Ⅱ Pausa</button>
              <button class="motion-btn is-hidden" id="stopAnim">■ Stop</button>
              <button class="motion-btn is-hidden" id="addKeyframe" title="Keyframe manual de respaldo">＋ Keyframe</button>
              <button class="motion-btn" id="addBubble">＋ Globito</button>
              <button class="motion-btn" id="undoAction" title="Volver a la interacción anterior">↶ Retroceder</button>
              <button class="motion-btn" id="bubblePointer" title="Cambiar lado de la puntita del globito">Punta ↓</button>
              <button class="motion-btn" id="clearKeyframes">× Limpiar</button>
              <button class="motion-btn" id="lockTimeline" type="button" title="Bloquear edición de keyframes">🔓 Editar</button>
              <label class="motion-timebox">Duración
                <input id="animDuration" type="number" min="2" max="60" step="1" value="10" /> s
              </label>
              <button class="motion-btn settings-toggle-inline" id="settingsToggle" type="button">⚙ Ajustes</button>
            </div>
          </div>

          <div class="step-arrows" aria-label="Recorrido por keyframes">
            <button class="step-arrow prev" id="stepPrev" type="button" title="Keyframe anterior" aria-label="Keyframe anterior"></button>
            <button class="step-arrow next" id="stepNext" type="button" title="Keyframe siguiente" aria-label="Keyframe siguiente"></button>
          </div>

          <div class="timeline-row">
            <div class="timeline-clock" id="timelineClock">00.0s</div>
            <div class="mini-timeline" id="miniTimeline" title="Clic: mover cabezal · al mover la cámara se guarda el keyframe">
              <div class="timeline-scale" id="timelineScale"></div>
              <div class="playhead" id="playhead"></div>
            </div>
            <div class="timeline-clock" id="durationClock">10.0s</div>
          </div>
          <div class="keyframe-list" id="keyframeList"></div>
        </div>
        </div>
      </section>
    </div>
  </main>

  <button class="side-tab" id="sideTab" type="button">Abrir ajustes</button>
  <button class="bottom-tab" id="bottomTab" type="button">Abrir línea</button>

  <script>
    (() => {
      'use strict';

      const root = document.documentElement;
      const body = document.body;
      const workspace = document.getElementById('workspace');
      const splitterV = document.getElementById('splitterV');
      const splitterH = document.getElementById('splitterH');
      const sideToggle = document.getElementById('sideToggle');
      const bottomToggle = document.getElementById('bottomToggle');
      const sideTab = document.getElementById('sideTab');
      const bottomTab = document.getElementById('bottomTab');

      const clamp = (n,min,max) => Math.max(min,Math.min(max,n));
      const isPhone = () => matchMedia('(max-width:760px)').matches;

      function setSide(open){
        if(isPhone()){
          body.classList.remove('side-hidden');
          body.classList.toggle('mobile-side-open',open);
        }else{
          body.classList.remove('mobile-side-open');
          body.classList.toggle('side-hidden',!open);
        }
        sideToggle.setAttribute('aria-pressed',String(open));
      }

      function setBottom(open){
        body.classList.toggle('bottom-hidden',!open);
        bottomToggle.setAttribute('aria-pressed',String(open));
      }

      sideToggle.addEventListener('click',()=>{
        const open = isPhone() ? !body.classList.contains('mobile-side-open') : body.classList.contains('side-hidden');
        setSide(open);
      });
      bottomToggle.addEventListener('click',()=>setBottom(body.classList.contains('bottom-hidden')));
      sideTab.addEventListener('click',()=>setSide(true));
      bottomTab.addEventListener('click',()=>setBottom(true));

      function beginDrag(event,axis){
        if(event.button !== undefined && event.button !== 0) return;
        if(axis === 'x' && isPhone()) return;
        event.preventDefault();

        const splitter = axis === 'x' ? splitterV : splitterH;
        const rect = workspace.getBoundingClientRect();
        splitter.classList.add('dragging');
        body.classList.add('is-dragging');
        body.style.cursor = axis === 'x' ? 'col-resize' : 'row-resize';

        try{ splitter.setPointerCapture(event.pointerId); }catch(_){ }

        const move = e => {
          e.preventDefault();
          if(axis === 'x'){
            const value = clamp(rect.right - e.clientX,260,Math.min(520,rect.width * .55));
            root.style.setProperty('--side-w',value + 'px');
          }else{
            const value = clamp(rect.bottom - e.clientY,105,Math.min(360,rect.height * .55));
            root.style.setProperty('--bottom-h',value + 'px');
          }
        };

        const end = () => {
          splitter.classList.remove('dragging');
          body.classList.remove('is-dragging');
          body.style.cursor = '';
          window.removeEventListener('pointermove',move,true);
          window.removeEventListener('pointerup',end,true);
          window.removeEventListener('pointercancel',end,true);
        };

        window.addEventListener('pointermove',move,{capture:true,passive:false});
        window.addEventListener('pointerup',end,{capture:true,once:true});
        window.addEventListener('pointercancel',end,{capture:true,once:true});
      }

      splitterV.addEventListener('pointerdown',e=>beginDrag(e,'x'),{passive:false});
      splitterH.addEventListener('pointerdown',e=>beginDrag(e,'y'),{passive:false});

      // Doble clic o doble toque sobre el agarre: cierra el panel asociado.
      splitterV.addEventListener('dblclick',e=>{e.preventDefault();setSide(false)});
      splitterH.addEventListener('dblclick',e=>{e.preventDefault();setBottom(false)});

      let phoneMode = isPhone();

      function syncResponsiveState(){
        const nowPhone = isPhone();
        if(nowPhone === phoneMode) return;
        phoneMode = nowPhone;

        if(nowPhone){
          body.classList.remove('side-hidden','mobile-side-open');
          sideToggle.setAttribute('aria-pressed','false');
        }else{
          body.classList.remove('mobile-side-open','side-hidden');
          sideToggle.setAttribute('aria-pressed','true');
        }
      }

      window.addEventListener('resize',syncResponsiveState,{passive:true});
      window.addEventListener('orientationchange',()=>setTimeout(syncResponsiveState,80),{passive:true});

      const viewer = document.getElementById('viewer');
      const resetCamera = document.getElementById('resetCamera');
      const modelSize = document.getElementById('modelSize');
      const exposure = document.getElementById('exposure');
      const shadow = document.getElementById('shadow');
      const shadowSoftness = document.getElementById('shadowSoftness');
      const brightness = document.getElementById('brightness');
      const contrast = document.getElementById('contrast');
      const saturation = document.getElementById('saturation');
      const metalExtra = document.getElementById('metalExtra');
      const polishExtra = document.getElementById('polishExtra');
      const modelSizeValue = document.getElementById('modelSizeValue');
      const exposureValue = document.getElementById('exposureValue');
      const shadowValue = document.getElementById('shadowValue');
      const shadowSoftnessValue = document.getElementById('shadowSoftnessValue');
      const brightnessValue = document.getElementById('brightnessValue');
      const contrastValue = document.getElementById('contrastValue');
      const saturationValue = document.getElementById('saturationValue');
      const metalExtraValue = document.getElementById('metalExtraValue');
      const polishExtraValue = document.getElementById('polishExtraValue');
      let originalMaterials = [];

      const initialCamera = '0deg 75deg 105%';
      function refreshViewer(){
        try{ viewer.requestUpdate?.(); }catch(_){ }
        requestAnimationFrame(()=>{
          try{ viewer.jumpCameraToGoal?.(); }catch(_){ }
        });
      }
      function applyModelSize(){
        const value = Number(modelSize.value) / 100;
        const scaleValue = `${value} ${value} ${value}`;
        viewer.scale = scaleValue;
        viewer.setAttribute('scale', scaleValue);
        modelSizeValue.value = `${modelSize.value}%`;
        refreshViewer();
      }
      function applyExposure(){
        viewer.exposure = Number(exposure.value);
        exposureValue.value = Number(exposure.value).toFixed(2);
      }
      function applyShadow(){
        viewer.shadowIntensity = Number(shadow.value);
        shadowValue.value = Number(shadow.value).toFixed(2);
        refreshViewer();
      }
      function applyShadowSoftness(){
        viewer.shadowSoftness = Number(shadowSoftness.value);
        shadowSoftnessValue.value = Number(shadowSoftness.value).toFixed(2);
        refreshViewer();
      }
      function applyVisualFilter(){
        const b = Number(brightness.value);
        const c = Number(contrast.value);
        const sat = Number(saturation.value);
        viewer.style.setProperty('--viewer-brightness', b);
        viewer.style.setProperty('--viewer-contrast', c);
        viewer.style.setProperty('--viewer-saturation', sat);
        brightnessValue.value = b.toFixed(2);
        contrastValue.value = c.toFixed(2);
        saturationValue.value = sat.toFixed(2);
      }

      function captureOriginalMaterials(){
        try{
          originalMaterials = (viewer.model?.materials || []).map(material => ({
            material,
            metalness:Number(material.pbrMetallicRoughness.metallicFactor ?? 0),
            roughness:Number(material.pbrMetallicRoughness.roughnessFactor ?? 1)
          }));
        }catch(_){ originalMaterials = []; }
      }
      function applyMaterialFinish(){
        const metal = Number(metalExtra.value);
        const polish = Number(polishExtra.value);
        metalExtraValue.value = metal.toFixed(2);
        polishExtraValue.value = polish.toFixed(2);
        for(const item of originalMaterials){
          try{
            const targetMetal = item.metalness + (1 - item.metalness) * metal;
            const targetRoughness = Math.max(0.02, item.roughness * (1 - polish * .92));
            item.material.pbrMetallicRoughness.setMetallicFactor(targetMetal);
            item.material.pbrMetallicRoughness.setRoughnessFactor(targetRoughness);
          }catch(_){ }
        }
        refreshViewer();
      }

      // En pantallas táctiles, el deslizador solo responde cuando el dedo empieza
      // cerca de la cápsula. Si se arrastra sobre la línea, el panel conserva el scroll vertical.
      const settingRanges = [...document.querySelectorAll('.control-group input[type="range"]')];
      const rangeGesture = new WeakMap();
      const thumbCenterX = (range) => {
        const rect = range.getBoundingClientRect();
        const min = Number(range.min || 0);
        const max = Number(range.max || 100);
        const value = Number(range.value || min);
        const ratio = max === min ? 0 : (value - min) / (max - min);
        const thumbHalf = 11;
        return rect.left + thumbHalf + ratio * Math.max(0, rect.width - thumbHalf * 2);
      };
      settingRanges.forEach((range) => {
        range.addEventListener('pointerdown', (event) => {
          const coarse = matchMedia('(pointer:coarse)').matches || event.pointerType === 'touch';
          if (!coarse) return;
          const allowed = Math.abs(event.clientX - thumbCenterX(range)) <= 34;
          rangeGesture.set(range, {allowed, value:range.value, pointerId:event.pointerId});
          if (!allowed) range.dataset.scrollGesture = 'true';
        }, true);
        range.addEventListener('input', () => {
          const state = rangeGesture.get(range);
          if (state && !state.allowed) range.value = state.value;
        }, true);
        const finish = (event) => {
          const state = rangeGesture.get(range);
          if (!state || state.pointerId !== event.pointerId) return;
          rangeGesture.delete(range);
          delete range.dataset.scrollGesture;
        };
        range.addEventListener('pointerup', finish, true);
        range.addEventListener('pointercancel', finish, true);
      });

      modelSize.addEventListener('input',applyModelSize,{passive:true});
      exposure.addEventListener('input',applyExposure,{passive:true});
      shadow.addEventListener('input',applyShadow,{passive:true});
      shadowSoftness.addEventListener('input',applyShadowSoftness,{passive:true});
      brightness.addEventListener('input',applyVisualFilter,{passive:true});
      contrast.addEventListener('input',applyVisualFilter,{passive:true});
      saturation.addEventListener('input',applyVisualFilter,{passive:true});
      metalExtra.addEventListener('input',applyMaterialFinish,{passive:true});
      polishExtra.addEventListener('input',applyMaterialFinish,{passive:true});
      viewer.addEventListener('viewer-materials-ready',()=>{ captureOriginalMaterials(); applyMaterialFinish(); },{once:true});
      viewer.addEventListener('load',()=>{ captureOriginalMaterials(); applyMaterialFinish(); },{once:true});

      // Keyframes y globitos: comportamiento trasladado del visor original.
      const addKeyframe = document.getElementById('addKeyframe');
      const addBubble = document.getElementById('addBubble');
      const undoAction = document.getElementById('undoAction');
      const bubblePointer = document.getElementById('bubblePointer');
      const clearKeyframes = document.getElementById('clearKeyframes');
      const lockTimeline = document.getElementById('lockTimeline');
      const animDuration = document.getElementById('animDuration');
      const stepPrev = document.getElementById('stepPrev');
      const stepNext = document.getElementById('stepNext');
      const miniTimeline = document.getElementById('miniTimeline');
      const timelineScale = document.getElementById('timelineScale');
      const playhead = document.getElementById('playhead');
      const keyframeList = document.getElementById('keyframeList');
      const animState = document.getElementById('animState');
      const timelineClock = document.getElementById('timelineClock');
      const durationClock = document.getElementById('durationClock');
      const bubbleLayer = document.getElementById('bubbleLayer');
      const pointerOrder = ['bottom','top','left','right','none'];
      let keyframes = [];
      let activeKeyframe = -1;
      let selectedBubbleId = null;
      let timelineLocked = false;
      let undoStack = [];
      let animationPausedAt = 0;
      let cameraCommitTimer = 0;
      let internalCameraChangeUntil = 0;
      let lastViewerInteractionUntil = 0;
      let isScrubbingTimeline = false;
      let suppressTimelineClickUntil = 0;

      const durationValue=()=>Math.max(2,Math.min(60,Number(animDuration.value)||10));
      const clampTime=t=>Math.max(0,Math.min(durationValue(),Number(t)||0));
      const fmt=t=>`${Math.max(0,t).toFixed(1).padStart(4,'0')}s`;
      const sortKeyframes=()=>keyframes.sort((a,b)=>a.time-b.time);
      function cameraState(){
        const o=viewer.getCameraOrbit?.(), t=viewer.getCameraTarget?.();
        return {orbit:{theta:Number(o?.theta)||0,phi:Number(o?.phi)||1.3,radius:Number(o?.radius)||2},
          target:{x:Number(t?.x)||0,y:Number(t?.y)||0,z:Number(t?.z)||0},
          fov:Number(viewer.getFieldOfView?.())||30};
      }
      function applyCameraState(s, jump=true){
        if(!s)return;
        internalCameraChangeUntil=Date.now()+500;
        viewer.cameraOrbit=`${s.orbit.theta}rad ${s.orbit.phi}rad ${s.orbit.radius}m`;
        viewer.cameraTarget=`${s.target.x}m ${s.target.y}m ${s.target.z}m`;
        viewer.fieldOfView=`${s.fov}deg`;
        if(jump) viewer.jumpCameraToGoal?.();
      }
      function snapshot(){return JSON.stringify({keyframes,activeKeyframe,selectedBubbleId,animationPausedAt});}
      function pushUndo(){undoStack.push(snapshot()); if(undoStack.length>40)undoStack.shift();}
      function restoreUndo(){
        if(!undoStack.length)return;
        const s=JSON.parse(undoStack.pop());
        keyframes=s.keyframes||[]; activeKeyframe=s.activeKeyframe??-1;
        selectedBubbleId=s.selectedBubbleId??null; animationPausedAt=clampTime(s.animationPausedAt||0);
        if(activeKeyframe>=0&&keyframes[activeKeyframe]) applyCameraState(keyframes[activeKeyframe].camera,true);
        renderAll(animationPausedAt);
      }
      function findKeyframeNear(time){
        const tolerance=Math.max(.12,durationValue()*.018); let best=-1,dist=Infinity;
        keyframes.forEach((kf,i)=>{const d=Math.abs(kf.time-time);if(d<=tolerance&&d<dist){best=i;dist=d;}});
        return best;
      }
      function selected(){sortKeyframes();return activeKeyframe>=0?keyframes[activeKeyframe]:null;}
      function selectedBubble(k=selected()){
        if(!k?.bubbles?.length)return null;
        let b=k.bubbles.find(x=>x.id===selectedBubbleId);
        if(!b){b=k.bubbles[0];selectedBubbleId=b.id;}
        return b;
      }
      function setTime(t){
        animationPausedAt=clampTime(t); const d=durationValue();
        playhead.style.left=`${d?animationPausedAt/d*100:0}%`;
        timelineClock.textContent=fmt(animationPausedAt); durationClock.textContent=fmt(d);
        animState.textContent=`${keyframes.length} keyframe${keyframes.length===1?'':'s'} · ${activeKeyframe>=0?'paso '+(activeKeyframe+1):'paso libre'} · ${fmt(animationPausedAt)}`;
      }
      function renderScale(){
        timelineScale.innerHTML=''; const d=durationValue(); const divisions=Math.min(20,Math.max(2,Math.round(d)));
        for(let i=0;i<=divisions;i++){
          const pct=i/divisions*100; const tick=document.createElement('span');
          tick.className='tick'+(i===0||i===divisions||i%5===0?' major':'');tick.style.left=`${pct}%`;timelineScale.appendChild(tick);
          if(i===0||i===divisions||i%5===0){const label=document.createElement('span');label.className='tick-label';label.style.left=`${pct}%`;label.textContent=`${Math.round(d*i/divisions)}s`;timelineScale.appendChild(label);}
        }
      }
      function renderBubbles(){
        bubbleLayer.innerHTML=''; const k=selected(); if(!k)return;
        (k.bubbles||[]).forEach(b=>{
          const el=document.createElement('div');
          el.className=`info-bubble pointer-${b.pointer||'bottom'}${b.id===selectedBubbleId?' selected':''}`;
          el.textContent=b.text||'Doble clic para editar este texto';
          el.style.left=`${b.x??50}%`; el.style.top=`${b.y??35}%`; el.tabIndex=0;
          el.addEventListener('click',ev=>{ev.stopPropagation();selectedBubbleId=b.id;renderBubbles();updatePointerButton();});
          el.addEventListener('dblclick',ev=>{ev.stopPropagation();selectedBubbleId=b.id;el.contentEditable='true';el.focus();document.execCommand?.('selectAll',false,null);});
          el.addEventListener('blur',()=>{if(el.isContentEditable){b.text=el.textContent.trim()||'Doble clic para editar este texto';el.contentEditable='false';}});
          el.addEventListener('input',()=>{b.text=el.textContent;});
          el.addEventListener('pointerdown',ev=>{
            selectedBubbleId=b.id; renderBubbles();
            const live=[...bubbleLayer.children].find(x=>x.textContent===b.text&&x.classList.contains('selected'))||el;
            if(live.isContentEditable)return;
            ev.preventDefault(); ev.stopPropagation(); pushUndo();
            const rect=bubbleLayer.getBoundingClientRect();
            const move=e=>{b.x=Math.max(0,Math.min(100,(e.clientX-rect.left)/rect.width*100));b.y=Math.max(0,Math.min(100,(e.clientY-rect.top)/rect.height*100));live.style.left=b.x+'%';live.style.top=b.y+'%';};
            const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
            window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
          });
          bubbleLayer.appendChild(el);
        });
      }
      function pointerLabel(p){return {bottom:'Punta ↓',top:'Punta ↑',left:'Punta ←',right:'Punta →',none:'Sin punta'}[p||'bottom'];}
      function updatePointerButton(){bubblePointer.textContent=pointerLabel(selectedBubble()?.pointer||'bottom');}
      function renderDots(){
        miniTimeline.querySelectorAll('.kf-dot').forEach(n=>n.remove()); sortKeyframes();
        keyframes.forEach((k,i)=>{
          const dot=document.createElement('button'); dot.type='button';
          dot.className='kf-dot'+(i===activeKeyframe?' active':''); dot.dataset.label=`${k.time.toFixed(1)}s`;
          dot.style.left=`${durationValue()?k.time/durationValue()*100:0}%`; dot.title=`Keyframe ${i+1} · arrastrar para mover`;
          dot.addEventListener('click',e=>{e.stopPropagation();if(Date.now()<suppressTimelineClickUntil)return;gotoKeyframe(keyframes.findIndex(x=>x.id===k.id));});
          dot.addEventListener('pointerdown',e=>startKeyframeDrag(e,k.id)); miniTimeline.appendChild(dot);
        });
      }
      function renderAll(time=animationPausedAt){
        sortKeyframes(); renderScale(); renderDots(); setTime(time);
        keyframeList.innerHTML='';
        stepPrev.disabled=!keyframes.length||activeKeyframe<=0; stepNext.disabled=!keyframes.length||activeKeyframe>=keyframes.length-1;
        miniTimeline.classList.toggle('timeline-locked',timelineLocked); lockTimeline.classList.toggle('locked',timelineLocked);
        lockTimeline.textContent=timelineLocked?'🔒 Bloqueado':'🔓 Editar'; renderBubbles(); updatePointerButton();
      }
      function setKeyframeAtCurrentTime(forceUpdate=false){
        if(timelineLocked)return; const time=clampTime(animationPausedAt); const camera=cameraState(); let i=findKeyframeNear(time);
        pushUndo();
        if(i>=0){keyframes[i].time=time;keyframes[i].camera=camera;activeKeyframe=i;}
        else {const id=Date.now()+Math.random();keyframes.push({id,time,camera,bubbles:[]});sortKeyframes();activeKeyframe=keyframes.findIndex(k=>k.id===id);}
        selectedBubbleId=null; renderAll(time);
      }
      function commitCameraInteractionAsKeyframe(){
        if(timelineLocked||isScrubbingTimeline)return; setKeyframeAtCurrentTime(false);
      }
      function scheduleAutoKeyframeFromCamera(event){
        if(timelineLocked||isScrubbingTimeline||Date.now()<internalCameraChangeUntil)return;
        const source=event?.detail?.source||'';
        if(source&&source!=='user-interaction')return;
        if(!source&&Date.now()>lastViewerInteractionUntil)return;
        clearTimeout(cameraCommitTimer); cameraCommitTimer=setTimeout(commitCameraInteractionAsKeyframe,560);
      }
      function gotoKeyframe(i){
        sortKeyframes(); if(i<0||i>=keyframes.length)return;
        activeKeyframe=i; selectedBubbleId=null; animationPausedAt=keyframes[i].time;
        applyCameraState(keyframes[i].camera,true); renderAll(animationPausedAt);
      }
      function timeFromClientX(x){const r=miniTimeline.getBoundingClientRect();const pad=14;return clampTime((Math.max(r.left+pad,Math.min(r.right-pad,x))-(r.left+pad))/Math.max(1,r.width-pad*2)*durationValue());}
      function startTimelineScrub(event){
        if(timelineLocked||event.target.closest('.kf-dot'))return;
        isScrubbingTimeline=true; event.preventDefault();
        const move=e=>{const t=timeFromClientX(e.clientX);activeKeyframe=findKeyframeNear(t);setTime(t);const k=activeKeyframe>=0?keyframes[activeKeyframe]:null;if(k)applyCameraState(k.camera,true);renderDots();renderBubbles();};
        const up=e=>{move(e);isScrubbingTimeline=false;suppressTimelineClickUntil=Date.now()+250;window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);};
        move(event);window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
      }
      function startKeyframeDrag(event,id){
        if(timelineLocked)return;event.preventDefault();event.stopPropagation();pushUndo();
        const dot=event.currentTarget;const rect=miniTimeline.getBoundingClientRect();let moved=false,remove=false;
        const move=e=>{const k=keyframes.find(x=>x.id===id);if(!k)return;moved=true;remove=e.clientY<rect.top-28||e.clientY>rect.bottom+36;k.time=timeFromClientX(e.clientX);animationPausedAt=k.time;activeKeyframe=keyframes.findIndex(x=>x.id===id);dot.style.left=`${k.time/durationValue()*100}%`;dot.classList.toggle('removing',remove);setTime(k.time);};
        const up=()=>{window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);suppressTimelineClickUntil=Date.now()+(moved?300:0);const i=keyframes.findIndex(x=>x.id===id);if(remove&&i>=0){keyframes.splice(i,1);activeKeyframe=-1;}else{sortKeyframes();activeKeyframe=keyframes.findIndex(x=>x.id===id);}renderAll(animationPausedAt);};
        window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);
      }
      function ensureCurrent(){
        let k=selected(); if(k)return k;
        setKeyframeAtCurrentTime(false); return selected();
      }
      addKeyframe.addEventListener('click',()=>setKeyframeAtCurrentTime(true));
      addBubble.addEventListener('click',()=>{const k=ensureCurrent();if(!k)return;pushUndo();const b={id:Date.now()+Math.random(),text:'Doble clic para editar este texto',x:62,y:30,pointer:'bottom'};k.bubbles||=[];k.bubbles.push(b);selectedBubbleId=b.id;renderBubbles();updatePointerButton();});
      bubblePointer.addEventListener('click',()=>{const b=selectedBubble();if(!b)return;pushUndo();const i=pointerOrder.indexOf(b.pointer||'bottom');b.pointer=pointerOrder[(i+1)%pointerOrder.length];renderBubbles();updatePointerButton();});
      undoAction.addEventListener('click',restoreUndo);
      clearKeyframes.addEventListener('click',()=>{pushUndo();keyframes=[];activeKeyframe=-1;selectedBubbleId=null;animationPausedAt=0;renderAll(0);});
      lockTimeline.addEventListener('click',()=>{timelineLocked=!timelineLocked;renderAll(animationPausedAt);});
      stepPrev.addEventListener('click',()=>gotoKeyframe(activeKeyframe-1));
      stepNext.addEventListener('click',()=>gotoKeyframe(activeKeyframe+1));
      animDuration.addEventListener('change',()=>{pushUndo();const d=durationValue();keyframes.forEach(k=>k.time=Math.min(k.time,d));animationPausedAt=Math.min(animationPausedAt,d);renderAll(animationPausedAt);});
      miniTimeline.addEventListener('pointerdown',startTimelineScrub);
      miniTimeline.addEventListener('click',e=>{if(timelineLocked||Date.now()<suppressTimelineClickUntil||e.target.closest('.kf-dot'))return;setTime(timeFromClientX(e.clientX));activeKeyframe=findKeyframeNear(animationPausedAt);renderAll(animationPausedAt);});
      viewer.addEventListener('pointerdown',()=>{lastViewerInteractionUntil=Date.now()+1600;});
      viewer.addEventListener('pointerup',()=>{lastViewerInteractionUntil=Date.now()+900;});
      viewer.addEventListener('touchstart',()=>{lastViewerInteractionUntil=Date.now()+1600;},{passive:true});
      viewer.addEventListener('touchend',()=>{lastViewerInteractionUntil=Date.now()+900;},{passive:true});
      viewer.addEventListener('camera-change',scheduleAutoKeyframeFromCamera);
      renderAll(0);

      resetCamera.addEventListener('click',()=>{
        modelSize.value='100'; exposure.value='1'; shadow.value='1';
        shadowSoftness.value='0.65'; brightness.value='1'; contrast.value='1'; saturation.value='1';
        metalExtra.value='0'; polishExtra.value='0';
        applyModelSize(); applyExposure(); applyShadow(); applyShadowSoftness(); applyVisualFilter(); applyMaterialFinish();
        viewer.setAttribute('camera-orbit',initialCamera);
        viewer.setAttribute('camera-target','auto auto auto');
        try{ viewer.jumpCameraToGoal(); }catch(_){ }
      });
      applyModelSize(); applyExposure(); applyShadow(); applyShadowSoftness(); applyVisualFilter();
    })();
  </script>

  <script>
    (() => {
      const viewer = document.getElementById('viewer');
      if (!viewer) return;
      viewer.addEventListener('load', () => {
        requestAnimationFrame(() => {
          try { viewer.jumpCameraToGoal(); } catch (_) {}
          try {
            const event = new CustomEvent('viewer-materials-ready');
            viewer.dispatchEvent(event);
          } catch (_) {}
        });
      }, {once:true});
    })();
  </script>
</body>
</html>
