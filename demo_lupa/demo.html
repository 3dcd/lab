<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="authoring-tool" content="Adobe_Animate_CC">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo prenda · lupa + color</title>
<script src="https://code.createjs.com/1.0.0/createjs.min.js"></script>
<script src="demo.js"></script>
<style>
  html,body{margin:0;height:100%;background:#ececef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
  #animation_container{position:absolute;left:0;top:0;width:1920px;height:1080px;background:#ececef}
  #canvas{position:absolute;display:block;background:#ececef}
  #dom_overlay_container{pointer-events:none;overflow:hidden;width:1920px;height:1080px;position:absolute;left:0;top:0}
  #controls{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.08);border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:10}
  .swatch{width:28px;height:28px;border:0;border-radius:50%;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),0 1px 4px rgba(0,0,0,.12)}
  .swatch:focus-visible{outline:3px solid #111;outline-offset:2px}
  #state{font-size:12px;color:#555;padding:0 4px;min-width:82px;text-align:center}
</style>
<script>
var canvas, stage, exportRoot, anim_container, dom_overlay_container, fnStartAnimation;
var zoomed = false;

function init() {
  canvas = document.getElementById("canvas");
  anim_container = document.getElementById("animation_container");
  dom_overlay_container = document.getElementById("dom_overlay_container");
  var comp=AdobeAn.getComposition("25F9150097594B11AEFF43ECB1966C95");
  var lib=comp.getLibrary();
  var loader = new createjs.LoadQueue(false);
  loader.addEventListener("fileload", function(evt){handleFileLoad(evt,comp)});
  loader.addEventListener("complete", function(evt){handleComplete(evt,comp)});
  loader.loadManifest(lib.properties.manifest);
}
function handleFileLoad(evt, comp) {
  var images=comp.getImages();
  if (evt && evt.item.type === "image") images[evt.item.id] = evt.result;
}
function handleComplete(evt,comp) {
  var lib=comp.getLibrary(), ss=comp.getSpriteSheet(), queue=evt.target, ssMetadata=lib.ssMetadata;
  for(var i=0;i<ssMetadata.length;i++) {
    ss[ssMetadata[i].name] = new createjs.SpriteSheet({images:[queue.getResult(ssMetadata[i].name)],frames:ssMetadata[i].frames});
  }
  exportRoot = new lib.demo();
  stage = new lib.Stage(canvas);
  stage.enableMouseOver(10);

  fnStartAnimation = function() {
    stage.addChild(exportRoot);
    addZoomButton();
    createjs.Ticker.framerate = lib.properties.fps;
    createjs.Ticker.addEventListener("tick", stage);
  };
  AdobeAn.makeResponsive(true,'both',true,1,[canvas,anim_container,dom_overlay_container]);
  AdobeAn.compositionLoaded(lib.properties.id);
  fnStartAnimation();
}

function addZoomButton(){
  var b = new createjs.Container();
  b.name = "lupa";
  b.x = 1100; b.y = 683;
  b.cursor = "pointer";

  var bg = new createjs.Shape();
  bg.graphics.beginFill("rgba(255,255,255,0.94)").drawCircle(0,0,27);
  bg.shadow = new createjs.Shadow("rgba(0,0,0,.22)",0,3,8);

  var icon = new createjs.Shape();
  icon.graphics.setStrokeStyle(5,"round","round").beginStroke("#16181D").drawCircle(-4,-4,8).moveTo(2,2).lineTo(11,11);

  b.addChild(bg,icon);
  b.hitArea = new createjs.Shape();
  b.hitArea.graphics.beginFill("#000").drawCircle(0,0,32);
  b.on("click", toggleZoom);
  b.on("mouseover", function(){ createjs.Tween.get(b).to({scaleX:1.08,scaleY:1.08},100); });
  b.on("mouseout", function(){ createjs.Tween.get(b).to({scaleX:1,scaleY:1},100); });
  stage.addChild(b);
}

function toggleZoom(){
  if(!exportRoot || !exportRoot.pecho) return;
  zoomed = !zoomed;
  exportRoot.pecho.gotoAndStop(zoomed ? 1 : 0);
  document.getElementById('state').textContent = zoomed ? 'Frame 2 · detalle' : 'Frame 1 · entero';
  stage.update();
}

function setGarmentColor(hex){
  if(!exportRoot || !exportRoot.pecho || !exportRoot.pecho.instance) return;
  var content = exportRoot.pecho.instance;
  var tint = content.instance_1;
  if(!tint) return;
  var rgb = hex.match(/[A-Fa-f0-9]{2}/g).map(function(v){return parseInt(v,16)});
  var f = new createjs.ColorFilter(0,0,0,1,rgb[0],rgb[1],rgb[2],0);
  tint.filters = [f];
  tint.cache(-635,-624,1269,1248);
  stage.update();
}
</script>
</head>
<body onload="init();">
  <div id="animation_container">
    <canvas id="canvas" width="1920" height="1080"></canvas>
    <div id="dom_overlay_container"></div>
  </div>
  <div id="controls" aria-label="Colores de prueba">
    <button class="swatch" style="background:#f3f3f0" onclick="setGarmentColor('#F3F3F0')" aria-label="Blanco"></button>
    <button class="swatch" style="background:#16181d" onclick="setGarmentColor('#16181D')" aria-label="Negro"></button>
    <button class="swatch" style="background:#c94b45" onclick="setGarmentColor('#C94B45')" aria-label="Rojo"></button>
    <button class="swatch" style="background:#406fa8" onclick="setGarmentColor('#406FA8')" aria-label="Azul"></button>
    <button class="swatch" style="background:#5a8668" onclick="setGarmentColor('#5A8668')" aria-label="Verde"></button>
    <span id="state">Frame 1 · entero</span>
  </div>
</body>
</html>
