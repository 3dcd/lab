<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mockup de estampados</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#0c0d0f;color:#fff;font-family:Arial,Helvetica,sans-serif;user-select:none;-webkit-user-select:none}
button,input{font:inherit}.app{height:100%;display:grid;grid-template-columns:220px 1fr}.tools{background:#17191d;border-right:1px solid #34373d;padding:12px;overflow:auto}
h1{font-size:17px;margin:0 0 4px}.sub{font-size:12px;color:#a9adb5;line-height:1.35;margin-bottom:12px}.box{border:1px solid #34373d;border-radius:12px;padding:9px;margin-bottom:9px;background:#121418}.box b{font-size:12px}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px}
.btn,.file{border:1px solid #3c4047;background:#23262b;color:#fff;border-radius:9px;padding:7px 9px;font-size:12px;cursor:pointer}.file input{display:none}.btn:disabled{opacity:.35}.danger{background:#4a2020}.status{font-size:11px;color:#a9adb5;line-height:1.35}
.shell{position:relative;overflow:auto;background:#08090a;padding:18px;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}.workspace{min-width:100%;min-height:100%;display:flex;justify-content:center;align-items:flex-start}.stage-wrap{position:relative;flex:0 0 auto}
canvas{display:block;background:#ddd;box-shadow:0 14px 50px #0007;touch-action:none}.handles{position:absolute;inset:0;pointer-events:none}.handle{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;border:3px solid #111;box-shadow:0 1px 5px #0007;pointer-events:auto;touch-action:none;display:none}.handle.show{display:block}
.outline{position:absolute;inset:0;pointer-events:none;display:none}.outline.show{display:block}.outline svg{width:100%;height:100%;overflow:visible}.outline polygon{fill:#ffffff08;stroke:#fff;stroke-width:1.5;stroke-dasharray:7 6;vector-effect:non-scaling-stroke}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#666;background:#fffffff0;border:1px dashed #777;border-radius:12px;padding:14px 18px;text-align:center;pointer-events:none;max-width:70%}
@media(max-width:900px){.app{grid-template-columns:185px 1fr}.tools{padding:9px}.btn,.file{font-size:11px;padding:7px 8px}}
</style>
</head>
<body>
<div class="app">
<aside class="tools">
<h1>Mockup de estampados</h1>
<div class="sub">Sólo fondo + PNG/SVG. Tocá un estampado para moverlo o deformarlo desde sus cuatro esquinas.</div>
<div class="box"><b>Fondo</b><div class="row"><label class="file">Cargar fondo<input id="bgInput" type="file" accept="image/png,image/jpeg,image/webp"></label></div></div>
<div class="box"><b>Estampados</b><div class="row"><label class="file">Agregar PNG / SVG<input id="overlayInput" type="file" multiple accept="image/png,image/svg+xml,.png,.svg"></label></div><div class="sub" style="margin:8px 0 0">También podés arrastrar PNG/SVG al lienzo.</div></div>
<div class="box"><b>Seleccionado</b><div class="row"><button class="btn" id="layerUp" disabled>Subir</button><button class="btn" id="layerDown" disabled>Bajar</button></div><div class="row"><button class="btn" id="duplicate" disabled>Duplicar</button><button class="btn danger" id="remove" disabled>Eliminar</button></div></div>
<div class="box"><b>Salida</b><div class="row"><button class="btn" id="exportBtn">Exportar PNG</button></div></div>
<div class="status" id="status">Cargá una imagen de fondo.</div>
</aside>
<main class="shell" id="shell"><div class="workspace"><div class="stage-wrap" id="stageWrap">
<canvas id="canvas" width="900" height="1200"></canvas>
<div class="outline" id="outline"><svg><polygon id="outlinePoly" points=""></polygon></svg></div>
<div class="handles" id="handles"><div class="handle" data-corner="0"></div><div class="handle" data-corner="1"></div><div class="handle" data-corner="2"></div><div class="handle" data-corner="3"></div></div>
<div class="hint" id="hint">Cargá una foto como fondo</div>
</div></div></main>
</div>
<script>
const $=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d'),shell=$('#shell'),wrap=$('#stageWrap'),hint=$('#hint'),outline=$('#outline'),poly=$('#outlinePoly'),handles=[...document.querySelectorAll('.handle')],statusEl=$('#status');
let bgImage=null,overlays=[],selected=-1,drag=null,fitScale=1,queued=false;
function status(t){statusEl.textContent=t}
function readURL(f){return new Promise((r,j)=>{let x=new FileReader;x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)})}
function loadImg(src){return new Promise((r,j)=>{let im=new Image;im.onload=()=>r(im);im.onerror=j;im.src=src})}
function fit(){let aw=Math.max(200,shell.clientWidth-36),ah=Math.max(200,shell.clientHeight-36);fitScale=Math.min(aw/canvas.width,ah/canvas.height,1);let w=canvas.width*fitScale,h=canvas.height*fitScale;canvas.style.width=w+'px';canvas.style.height=h+'px';wrap.style.width=w+'px';wrap.style.height=h+'px';outline.style.width=w+'px';outline.style.height=h+'px';$('#handles').style.width=w+'px';$('#handles').style.height=h+'px';updateUI()}
window.addEventListener('resize',fit);
function point(cx,cy){let r=canvas.getBoundingClientRect();return{x:(cx-r.left)*canvas.width/r.width,y:(cy-r.top)*canvas.height/r.height}}
function bilerp(q,u,v){let a=q[0],b=q[1],c=q[2],d=q[3];return{x:(1-u)*(1-v)*a.x+u*(1-v)*b.x+u*v*c.x+(1-u)*v*d.x,y:(1-u)*(1-v)*a.y+u*(1-v)*b.y+u*v*c.y+(1-u)*v*d.y}}
function affine(s0,s1,s2,d0,d1,d2){let den=s0.x*(s1.y-s2.y)+s1.x*(s2.y-s0.y)+s2.x*(s0.y-s1.y);if(Math.abs(den)<1e-8)return null;let a=(d0.x*(s1.y-s2.y)+d1.x*(s2.y-s0.y)+d2.x*(s0.y-s1.y))/den,c=(d0.x*(s2.x-s1.x)+d1.x*(s0.x-s2.x)+d2.x*(s1.x-s0.x))/den,e=(d0.x*(s1.x*s2.y-s2.x*s1.y)+d1.x*(s2.x*s0.y-s0.x*s2.y)+d2.x*(s0.x*s1.y-s1.x*s0.y))/den,b=(d0.y*(s1.y-s2.y)+d1.y*(s2.y-s0.y)+d2.y*(s0.y-s1.y))/den,d=(d0.y*(s2.x-s1.x)+d1.y*(s0.x-s2.x)+d2.y*(s1.x-s0.x))/den,f=(d0.y*(s1.x*s2.y-s2.x*s1.y)+d1.y*(s2.x*s0.y-s0.x*s2.y)+d2.y*(s0.x*s1.y-s1.x*s0.y))/den;return[a,b,c,d,e,f]}
function tri(g,img,s0,s1,s2,d0,d1,d2){let m=affine(s0,s1,s2,d0,d1,d2);if(!m)return;g.save();g.beginPath();g.moveTo(d0.x,d0.y);g.lineTo(d1.x,d1.y);g.lineTo(d2.x,d2.y);g.closePath();g.clip();g.transform(...m);g.drawImage(img,0,0);g.restore()}
function warp(g,it){let img=it.img,q=it.quad,N=10,iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;for(let y=0;y<N;y++)for(let x=0;x<N;x++){let u0=x/N,u1=(x+1)/N,v0=y/N,v1=(y+1)/N,p00=bilerp(q,u0,v0),p10=bilerp(q,u1,v0),p11=bilerp(q,u1,v1),p01=bilerp(q,u0,v1),s00={x:u0*iw,y:v0*ih},s10={x:u1*iw,y:v0*ih},s11={x:u1*iw,y:v1*ih},s01={x:u0*iw,y:v1*ih};tri(g,img,s00,s10,s11,p00,p10,p11);tri(g,img,s00,s11,s01,p00,p11,p01)}}
function requestRender(){if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;render()})}
function render(){ctx.clearRect(0,0,canvas.width,canvas.height);if(bgImage)ctx.drawImage(bgImage,0,0,canvas.width,canvas.height);else{ctx.fillStyle='#ddd';ctx.fillRect(0,0,canvas.width,canvas.height)}overlays.forEach(o=>warp(ctx,o));updateUI()}
function setSelected(i){selected=i;let on=i>=0&&i<overlays.length;$('#layerUp').disabled=!on;$('#layerDown').disabled=!on;$('#duplicate').disabled=!on;$('#remove').disabled=!on;updateUI()}
function updateUI(){let it=overlays[selected];if(!it){outline.classList.remove('show');handles.forEach(h=>h.classList.remove('show'));return}outline.classList.add('show');poly.setAttribute('points',it.quad.map(p=>`${p.x*fitScale},${p.y*fitScale}`).join(' '));handles.forEach((h,i)=>{h.classList.add('show');h.style.left=it.quad[i].x*fitScale+'px';h.style.top=it.quad[i].y*fitScale+'px'})}
function inside(p,q){let sign=0;for(let i=0;i<4;i++){let a=q[i],b=q[(i+1)%4],c=(b.x-a.x)*(p.y-a.y)-(b.y-a.y)*(p.x-a.x);if(Math.abs(c)<.001)continue;let s=Math.sign(c);if(!sign)sign=s;else if(s!==sign)return false}return true}
async function setBg(f){let src=await readURL(f),im=await loadImg(src);bgImage=im;canvas.width=im.naturalWidth||im.width;canvas.height=im.naturalHeight||im.height;hint.style.display='none';fit();requestRender();status(`Fondo ${canvas.width} × ${canvas.height}`)}
async function addFile(f,x=null,y=null){let src=await readURL(f),im=await loadImg(src),iw=im.naturalWidth||im.width,ih=im.naturalHeight||im.height,s=Math.min(canvas.width*.3/iw,canvas.height*.24/ih,1),w=Math.max(80,iw*s),h=Math.max(80,ih*s),cx=x??canvas.width/2,cy=y??canvas.height/2;overlays.push({img:im,src,quad:[{x:cx-w/2,y:cy-h/2},{x:cx+w/2,y:cy-h/2},{x:cx+w/2,y:cy+h/2},{x:cx-w/2,y:cy+h/2}]});setSelected(overlays.length-1);requestRender();status('Estampado agregado. Arrastrá sus cuatro esquinas.')}
$('#bgInput').onchange=async e=>{let f=e.target.files?.[0];if(f)await setBg(f);e.target.value=''};$('#overlayInput').onchange=async e=>{for(let f of [...(e.target.files||[])])await addFile(f);e.target.value=''};
canvas.onpointerdown=e=>{e.preventDefault();let p=point(e.clientX,e.clientY),hit=-1;for(let i=overlays.length-1;i>=0;i--)if(inside(p,overlays[i].quad)){hit=i;break}setSelected(hit);if(hit>=0){drag={t:'move',id:e.pointerId,start:p,q:overlays[hit].quad.map(v=>({...v}))};canvas.setPointerCapture?.(e.pointerId)}};
canvas.onpointermove=e=>{if(!drag||drag.t!=='move'||drag.id!==e.pointerId||selected<0)return;e.preventDefault();let p=point(e.clientX,e.clientY),dx=p.x-drag.start.x,dy=p.y-drag.start.y;overlays[selected].quad=drag.q.map(v=>({x:v.x+dx,y:v.y+dy}));requestRender()};
canvas.onpointerup=canvas.onpointercancel=e=>{if(drag?.t==='move'&&drag.id===e.pointerId)drag=null};
handles.forEach((h,c)=>{h.onpointerdown=e=>{if(selected<0)return;e.preventDefault();e.stopPropagation();drag={t:'corner',id:e.pointerId,c};h.setPointerCapture?.(e.pointerId)};h.onpointermove=e=>{if(!drag||drag.t!=='corner'||drag.id!==e.pointerId||selected<0)return;e.preventDefault();e.stopPropagation();overlays[selected].quad[c]=point(e.clientX,e.clientY);requestRender()};h.onpointerup=h.onpointercancel=e=>{if(drag?.t==='corner'&&drag.id===e.pointerId)drag=null}});
$('#layerUp').onclick=()=>{if(selected<0||selected>=overlays.length-1)return;[overlays[selected],overlays[selected+1]]=[overlays[selected+1],overlays[selected]];selected++;requestRender()};$('#layerDown').onclick=()=>{if(selected<=0)return;[overlays[selected],overlays[selected-1]]=[overlays[selected-1],overlays[selected]];selected--;requestRender()};
$('#duplicate').onclick=()=>{if(selected<0)return;let a=overlays[selected];overlays.push({img:a.img,src:a.src,quad:a.quad.map(p=>({x:p.x+24,y:p.y+24}))});setSelected(overlays.length-1);requestRender()};$('#remove').onclick=()=>{if(selected<0)return;overlays.splice(selected,1);setSelected(Math.min(selected,overlays.length-1));requestRender()};
wrap.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='copy'};wrap.ondrop=async e=>{e.preventDefault();let p=point(e.clientX,e.clientY);for(let f of [...(e.dataTransfer.files||[])])if(f.type==='image/png'||f.type==='image/svg+xml'||/\.png$|\.svg$/i.test(f.name))await addFile(f,p.x,p.y)};
$('#exportBtn').onclick=async()=>{let out=document.createElement('canvas');out.width=canvas.width;out.height=canvas.height;let g=out.getContext('2d');if(bgImage)g.drawImage(bgImage,0,0,out.width,out.height);else{g.fillStyle='#ddd';g.fillRect(0,0,out.width,out.height)}overlays.forEach(o=>warp(g,o));let blob=await new Promise(r=>out.toBlob(r,'image/png')),file=new File([blob],'mockup-estampado.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:'Mockup de estampado'});return}catch(e){}}let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mockup-estampado.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
fit();render();
</script>
</body>
</html>
