Oficial)","text":"","url":"","linkLabel":"Abrir enlace","image":"imagenes/11-patricio-rey-y-sus-redonditos-de-ricota-en-directo-1992-full.png","media":"audios/11-patricio-rey-y-sus-redonditos-de-ricota-en-directo-1992-full.mp3","kind":"audio","markers":[{"label":"Nuestro Amo Juega al Esclavo","time":0},{"label":"Barbazul Versus el Amor Letal","time":240},{"label":"Yo no me Cai del Cielo","time":464},{"label":"Heroe del Whisky","time":671},{"label":"La Parabellum del Buen Psicopata","time":887},{"label":"Maldicion va a ser un Dia Hermoso","time":1269},{"label":"El Blues del Noticiero","time":1500},{"label":"Todo un Palo","time":1734},{"label":"Unos Pocos Peligros Sensatos","time":2195},{"label":"Criminal Mambo","time":2387},{"label":"Rock para los Dientes","time":2716},{"label":"Vamos las Bandas","time":2928}]}];let active=-1;const list=document.getElementById('list'),now=document.getElementById('now'),nowTitle=document.getElementById('nowTitle'),nowToggle=document.getElementById('nowToggle');const fmt=s=>{if(!isFinite(s))return'0:00';s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'):m+':'+String(sec).padStart(2,'0')};const E=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
list.innerHTML=entries.map((e,i)=>{const visual=e.kind==='video'?`<video class="media" preload="metadata" playsinline src="${E(e.media)}" ${e.image?`poster="${E(e.image)}"`:''}></video>`:(e.image?`<img src="${E(e.image)}" alt="${E(e.title)}">`:'<div class="emptyVisual">Audio sin imagen</div>');const hidden=e.kind==='video'?'':`<audio class="media" preload="metadata" src="${E(e.media)}"></audio>`;const jumps=(e.markers||[]).length?`<div class="chapters">${e.markers.map(m=>`<button class="jump" data-act="jump" data-time="${m.time}"><b>${E(m.label)}</b><span>${fmt(m.time)}</span></button>`).join('')}</div>`:'';return `<article class="card ${e.kind==='video'?'video-card':''}" data-i="${i}" id="pieza-${i+1}"><div class="cover" data-act="toggle">${visual}<div class="overlay"><div class="playBig">▶</div></div></div><div class="body"><h2>${E(e.title||('Pieza '+(i+1)))}</h2>${e.text?`<p class="desc">${E(e.text)}</p>`:''}<div class="controls"><button class="cbtn" data-act="prev" title="Pista anterior">⏮</button><button class="cbtn" data-act="back" title="Retroceder 10 segundos">−10</button><button class="cbtn main" data-act="toggle" title="Reproducir o pausar">▶</button><button class="cbtn" data-act="stop" title="Detener">■</button><button class="cbtn" data-act="forward" title="Avanzar 10 segundos">+10</button><button class="cbtn" data-act="next" title="Pista siguiente">⏭</button><span class="spacer"></span><div class="timeline"><span class="time cur">0:00</span><input class="seek" type="range" min="0" max="1000" value="0"><span class="time dur">0:00</span></div></div>${jumps}${e.url?`<a class="link" href="${E(e.url)}" target="_blank" rel="noopener">${E(e.linkLabel||'Abrir enlace')} ↗</a>`:''}${hidden}</div></article>`}).join('');
const cards=[...document.querySelectorAll('.card')];const mediaAt=i=>cards[i]?.querySelector('.media');
function setActive(i,autoplay=true,scroll=true){if(!cards.length)return;if(i<0)i=cards.length-1;if(i>=cards.length)i=0;cards.forEach((c,n)=>{const m=mediaAt(n);if(n!==i){m.pause();c.classList.remove('playing');c.querySelectorAll('button[data-act=toggle]').forEach(b=>b.textContent='▶');c.querySelector('.playBig').textContent='▶'}});active=i;const c=cards[i],m=mediaAt(i);nowTitle.textContent=entries[i].title||('Pieza '+(i+1));now.classList.add('show');if(autoplay)m.play().catch(()=>{});if(scroll)c.scrollIntoView({behavior:'smooth',block:'center'});sync(c,m)}
function sync(c,m){const playing=!m.paused&&!m.ended;c.classList.toggle('playing',playing);c.querySelector('.playBig').textContent=playing?'Ⅱ':'▶';c.querySelectorAll('button[data-act=toggle]').forEach(b=>b.textContent=playing?'Ⅱ':'▶');if(c===cards[active])nowToggle.textContent=playing?'Ⅱ':'▶'}
function toggle(i){if(active!==i){setActive(i,true);return}const m=mediaAt(i);m.paused?m.play().catch(()=>{}):m.pause();sync(cards[i],m)}
function stop(i){const m=mediaAt(i);m.pause();m.currentTime=0;sync(cards[i],m)}
function seekBy(i,delta){if(active!==i)setActive(i,false,false);const m=mediaAt(i),target=Math.max(0,m.currentTime+delta);m.currentTime=Number.isFinite(m.duration)?Math.min(target,m.duration):target}
function jumpTo(i,seconds){if(active!==i)setActive(i,false,false);const m=mediaAt(i);const apply=()=>{const target=Number.isFinite(m.duration)?Math.min(seconds,Math.max(0,m.duration-.05)):seconds;m.currentTime=Math.max(0,target);m.play().catch(()=>{});sync(cards[i],m)};if(m.readyState>=1)apply();else m.addEventListener('loadedmetadata',apply,{once:true})}
list.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const c=el.closest('.card'),i=Number(c.dataset.i),act=el.dataset.act;if(act==='toggle')toggle(i);if(act==='stop')stop(i);if(act==='back')seekBy(i,-10);if(act==='forward')seekBy(i,10);if(act==='prev')setActive(i-1,true);if(act==='next')setActive(i+1,true);if(act==='jump')jumpTo(i,Number(el.dataset.time)||0)});
cards.forEach((c,i)=>{const m=mediaAt(i),seek=c.querySelector('.seek'),cur=c.querySelector('.cur'),dur=c.querySelector('.dur');m.addEventListener('loadedmetadata',()=>dur.textContent=fmt(m.duration));m.addEventListener('timeupdate',()=>{cur.textContent=fmt(m.currentTime);seek.value=m.duration?Math.round(m.currentTime/m.duration*1000):0});m.addEventListener('play',()=>{if(active!==i)setActive(i,false,false);sync(c,m)});m.addEventListener('pause',()=>sync(c,m));m.addEventListener('ended',()=>{sync(c,m);if(i<cards.length-1)setActive(i+1,true)});seek.addEventListener('input',()=>{if(m.duration)m.currentTime=(seek.value/1000)*m.duration})});
nowToggle.addEventListener('click',()=>{if(active>=0)toggle(active)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,button'))return;if(e.code==='Space'){e.preventDefault();active<0?setActive(0,true):toggle(active)}if(e.code==='ArrowRight'&&active>=0)seekBy(active,10);if(e.code==='ArrowLeft'&&active>=0)seekBy(active,-10);if(e.shiftKey&&e.code==='ArrowRight'&&active>=0)setActive(active+1,true);if(e.shiftKey&&e.code==='ArrowLeft'&&active>=0)setActive(active-1,true)});
